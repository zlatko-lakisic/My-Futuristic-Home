livingroom_climate_state:
  name: Livingroom Climate State
livingroom_climate_target_temperature:
  name: Livingroom Climate Target Temperature

# Gate / zone AI last-run helpers (written by zone_activity + gate_open blueprints).
# Must live here — configuration.yaml also has `input_text: !include input_text.yaml`,
# which replaces any earlier inline input_text block.
gate_ai_last_gate:
  name: Gate AI Last Gate
  max: 100
gate_ai_last_classification:
  name: Gate AI Last Classification
  max: 32
gate_ai_last_summary:
  name: Gate AI Last Summary
  max: 255

# Infohash of the transfer whose Radarr/Sonarr detail sheet is open on the Torrents
# dashboard; empty means closed. initial clears it so a restart never reopens the sheet.
torrent_detail_hash:
  name: Torrent detail hash
  max: 64
  initial: ""

# Last Garden Speaker dashboard action result (written by garden_speaker_* scripts).
garden_speaker_action_status:
  name: Garden Speaker action status
  max: 255
  initial: ""
