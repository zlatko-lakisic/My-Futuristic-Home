blueprint:
  name: Zone activity — LLM Vision alert
  description: |
    When Frigate reports activity in a zone, settle briefly, capture a longer still
    burst (optionally waiting for a person if a car triggered first), stitch a GIF,
    resolve any Frigate-recognized faces for the visit, ask LLM Vision what is there,
    and notify only when confirmed.

    - Driveway mode: notify for PERSON / CAR. When a vehicle is visible, the LLM should
      include color + make/model when identifiable, and a license plate only if clearly
      readable (never invent plates). Known-vehicle hints can be supplied as context.
    - People-only mode (front steps): notify for PERSON only.
    - Prompt is low-temperature and factual (light wit OK; no invented pets/plots/dialogue).
    - Recognized faces (sub_labels) are pulled from Frigate events and added to the
      notification title/body when available.
    - Push title ≤ 50 chars, push body ≤ 100 chars; HA persistent home-log ≤ 160 chars.
    - If the LLM fails/junk but Frigate reported matching occupancy during the visit,
      notify with a simple fallback summary (uses latched occupancy, not live state at
      decision time — capture + LLM often outlast the brief Frigate pulse).
    - Holds the event open until trigger sensors stay clear for a configurable gap so one
      prolonged visit does not spam notifications.
  domain: automation
  homeassistant:
    min_version: '2024.6.0'
  input:
    zone_name:
      name: Zone name
      description: Shown in notifications and the LLM prompt (e.g. Near driveway).
      selector:
        text:
    zone_slug:
      name: Snapshot file slug
      description: Safe prefix for /config/www/tmp/<slug>_timestamp_<n>.jpg.
      default: zone
      selector:
        text:
    trigger_sensors:
      name: Trigger occupancy sensors
      description: Frigate zone sensors that start an event (person and/or car).
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    person_sensor:
      name: Zone person occupancy
      description: Used for Frigate person fallback when LLM fails.
      selector:
        entity:
          domain: binary_sensor
    car_sensor:
      name: Zone car occupancy (optional)
      description: Leave empty for people-only zones (front steps). Used for Frigate car fallback.
      default: ""
      selector:
        text:
    dog_sensor:
      name: Zone dog occupancy (optional)
      description: >
        If set, latched during the visit so fallback text can say "with dog" when Frigate
        saw a dog (LLM still must not invent pets).
      default: ""
      selector:
        text:
    people_only:
      name: People only
      description: If on, only notify for people (ignore cars / CAR classifications).
      default: false
      selector:
        boolean:
    known_vehicle_hint:
      name: Known vehicles hint
      description: >
        Optional name-only context for the LLM (driveway). Example: "Household vehicle
        may be Family Car — say Family Car only on a clear visual match. Do not invent
        plates or other names." Never put plate digits here (they get echoed). Leave empty
        for people-only zones. Notify titles use Frigate LPR when configured.
      default: ""
      selector:
        text:
          multiline: true
    camera:
      name: Camera
      selector:
        entity:
          domain: camera
    llmvision_provider:
      name: LLM Vision provider
      selector:
        config_entry:
          integration: llmvision
    llmvision_model:
      name: Vision model
      default: gpt-4o-mini
      selector:
        text:
    target_width:
      name: Target image width (px)
      default: 1280
      selector:
        number:
          min: 512
          max: 1920
          step: 64
          mode: slider
    capture_settle_seconds:
      name: Seconds to wait before first snapshot
      description: >
        Short settle after occupancy so the subject is more likely in-frame before
        the burst starts (important when one visit is coalesced into a single notify).
      default: 3
      selector:
        number:
          min: 0
          max: 30
          step: 1
          mode: slider
    prefer_person_wait_seconds:
      name: Extra wait for person (driveway)
      description: >
        When a car/vehicle can trigger first, wait this long for zone person occupancy
        before capturing so the preview GIF includes the person when they arrive shortly
        after. Times out and captures anyway (car-only visits still notify). Use 0 to disable.
      default: 12
      selector:
        number:
          min: 0
          max: 60
          step: 1
          mode: slider
    frame_interval_seconds:
      name: Seconds between snapshots
      default: 2
      selector:
        number:
          min: 0
          max: 10
          step: 1
          mode: slider
    stream_max_frames:
      name: Number of still frames
      default: 15
      selector:
        number:
          min: 1
          max: 24
          step: 1
          mode: slider
    gif_frame_duration_ms:
      name: GIF frame duration (ms)
      description: >
        Playback time per still in the notification/dashboard preview GIF. Keep near
        1000 so the longer sample is watchable (not a 3-second blur).
      default: 1000
      selector:
        number:
          min: 200
          max: 2000
          step: 50
          mode: slider
    event_clear_seconds:
      name: Seconds zone must stay clear to end event
      description: >
        After analysis, wait until trigger sensors are gone, then require this many seconds
        of continuous clear before allowing another notification.
      default: 180
      selector:
        number:
          min: 30
          max: 900
          step: 30
          mode: slider
    public_base_url:
      name: Public image URL base
      default: "https://ha.mostardesigns.com/local/"
      selector:
        text:
    notification_click_path:
      name: Dashboard path (tap / click action)
      default: /dashboard-garage/driveway
      selector:
        text:
    notify_group:
      name: Mobile notification group
      default: ha-zones
      selector:
        text:
    notify_channel:
      name: Mobile notification channel
      default: HA Zones
      selector:
        text:
    notify_service:
      name: Notify service
      default: notify.notify
      selector:
        text:
    notify_people:
      name: Notify people
      selector:
        entity:
          domain: person
          multiple: true
    frigate_camera:
      name: Frigate camera name
      description: Exact Frigate camera id used in the API (e.g. driveway, front_door).
      default: ""
      selector:
        text:
    frigate_zone:
      name: Frigate zone name (optional)
      description: >
        If set, only person events that entered this Frigate zone are used for name lookup
        (e.g. driveway_zone, near_front_door). Leave empty to use the whole camera.
      default: ""
      selector:
        text:
    recognized_face_sensor:
      name: Last recognized face sensor (fallback)
      description: Camera sensor like sensor.driveway_last_recognized_face used if API lookup is empty.
      default: ""
      selector:
        text:
    recognized_plate_sensor:
      name: Last recognized plate sensor (Frigate LPR)
      description: >
        Camera sensor like sensor.driveway_last_recognized_plate. When set, notify titles
        and Plate lines use this Frigate value only (not LLM-guessed plates).
      default: ""
      selector:
        text:
    frigate_base_url:
      name: Frigate API base URL
      default: "http://192.168.89.37:5000"
      selector:
        text:

mode: single
max_exceeded: silent
variables:
  zone_name: !input zone_name
  zone_slug: !input zone_slug
  trigger_sensors: !input trigger_sensors
  person_sensor: !input person_sensor
  car_sensor: !input car_sensor
  dog_sensor: !input dog_sensor
  people_only: !input people_only
  known_vehicle_hint: !input known_vehicle_hint
  event_clear_seconds: !input event_clear_seconds
  capture_settle_seconds: !input capture_settle_seconds
  prefer_person_wait_seconds: !input prefer_person_wait_seconds
  gif_frame_duration_ms: !input gif_frame_duration_ms
  frigate_camera: !input frigate_camera
  frigate_zone: !input frigate_zone
  recognized_face_sensor: !input recognized_face_sensor
  recognized_plate_sensor: !input recognized_plate_sensor
  frigate_base_url: !input frigate_base_url
  notify_group: !input notify_group
  notify_channel: !input notify_channel
  snapshot_timestamp: '{{ now().strftime("%Y%m%d-%H%M%S") }}'
  event_start_epoch: '{{ as_timestamp(now()) | int }}'
  snapshot_frame_count: !input stream_max_frames
  frame_interval_seconds: !input frame_interval_seconds
  snapshot_rel: 'tmp/{{ zone_slug }}_{{ snapshot_timestamp }}_1.jpg'
  clip_gif_rel: 'tmp/{{ zone_slug }}_{{ snapshot_timestamp }}.gif'
  clip_latest_gif_rel: 'tmp/{{ zone_slug }}_latest.gif'
  public_base_url: !input public_base_url
  public_gif_url: '{{ public_base_url }}{{ clip_gif_rel }}'
  capture_span_seconds: >-
    {{ (capture_settle_seconds | int)
       + ([0, (snapshot_frame_count | int) - 1] | max) * (frame_interval_seconds | int) }}
triggers:
  - trigger: state
    entity_id: !input trigger_sensors
    from: 'off'
    to: 'on'
actions:
  - alias: Latch which Frigate sensors started / are active for this visit
    variables:
      saw_person: >-
        {% set person_eid = person_sensor | default('', true) | string | trim %}
        {% set trig = trigger.entity_id | default('', true) | string %}
        {% if person_eid in ['', 'None', 'none', 'unknown', 'unavailable'] %}
          no
        {% elif trig == person_eid or is_state(person_eid, 'on') %}
          yes
        {% else %}
          no
        {% endif %}
      saw_car: >-
        {% set car_eid = car_sensor | default('', true) | string | trim %}
        {% set trig = trigger.entity_id | default('', true) | string %}
        {% if car_eid in ['', 'None', 'none', 'unknown', 'unavailable'] %}
          no
        {% elif trig == car_eid or is_state(car_eid, 'on') %}
          yes
        {% else %}
          no
        {% endif %}
      saw_dog: >-
        {% set dog_eid = dog_sensor | default('', true) | string | trim %}
        {% set trig = trigger.entity_id | default('', true) | string %}
        {% if dog_eid in ['', 'None', 'none', 'unknown', 'unavailable'] %}
          no
        {% elif trig == dog_eid or is_state(dog_eid, 'on') %}
          yes
        {% else %}
          no
        {% endif %}
  - alias: Settle so subject is more likely in frame
    delay:
      seconds: '{{ capture_settle_seconds | int }}'
  - alias: If vehicle arrived first, wait briefly for a person
    if:
    - condition: template
      value_template: >-
        {% set only_people = people_only is true or (people_only | string | lower) in ['true', 'on', 'yes'] %}
        {% set wait_s = prefer_person_wait_seconds | int %}
        {% set person_eid = person_sensor | default('', true) | string | trim %}
        {{ (not only_people)
           and wait_s > 0
           and person_eid not in ['', 'None', 'none', 'unknown', 'unavailable']
           and not is_state(person_eid, 'on') }}
    then:
    - wait_template: "{{ is_state(person_sensor, 'on') }}"
      timeout:
        seconds: '{{ prefer_person_wait_seconds | int }}'
      continue_on_timeout: true
  - alias: Refresh occupancy latch after settle / person wait
    variables:
      saw_person: >-
        {% set person_eid = person_sensor | default('', true) | string | trim %}
        {% if (saw_person | default('no') | string | trim) == 'yes' %}
          yes
        {% elif person_eid not in ['', 'None', 'none', 'unknown', 'unavailable'] and is_state(person_eid, 'on') %}
          yes
        {% else %}
          no
        {% endif %}
      saw_car: >-
        {% set car_eid = car_sensor | default('', true) | string | trim %}
        {% if (saw_car | default('no') | string | trim) == 'yes' %}
          yes
        {% elif car_eid not in ['', 'None', 'none', 'unknown', 'unavailable'] and is_state(car_eid, 'on') %}
          yes
        {% else %}
          no
        {% endif %}
      saw_dog: >-
        {% set dog_eid = dog_sensor | default('', true) | string | trim %}
        {% if (saw_dog | default('no') | string | trim) == 'yes' %}
          yes
        {% elif dog_eid not in ['', 'None', 'none', 'unknown', 'unavailable'] and is_state(dog_eid, 'on') %}
          yes
        {% else %}
          no
        {% endif %}
  - repeat:
      count: '{{ snapshot_frame_count | int }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ repeat.index > 1 }}'
        then:
        - delay:
            seconds: '{{ frame_interval_seconds }}'
      - action: camera.snapshot
        target:
          entity_id: !input camera
        data:
          filename: '/config/www/tmp/{{ zone_slug }}_{{ snapshot_timestamp }}_{{ repeat.index }}.jpg'
      - alias: Keep latching occupancy seen during the burst
        variables:
          saw_person: >-
            {% set person_eid = person_sensor | default('', true) | string | trim %}
            {% if (saw_person | default('no') | string | trim) == 'yes' %}
              yes
            {% elif person_eid not in ['', 'None', 'none', 'unknown', 'unavailable'] and is_state(person_eid, 'on') %}
              yes
            {% else %}
              no
            {% endif %}
          saw_car: >-
            {% set car_eid = car_sensor | default('', true) | string | trim %}
            {% if (saw_car | default('no') | string | trim) == 'yes' %}
              yes
            {% elif car_eid not in ['', 'None', 'none', 'unknown', 'unavailable'] and is_state(car_eid, 'on') %}
              yes
            {% else %}
              no
            {% endif %}
          saw_dog: >-
            {% set dog_eid = dog_sensor | default('', true) | string | trim %}
            {% if (saw_dog | default('no') | string | trim) == 'yes' %}
              yes
            {% elif dog_eid not in ['', 'None', 'none', 'unknown', 'unavailable'] and is_state(dog_eid, 'on') %}
              yes
            {% else %}
              no
            {% endif %}
  - action: shell_command.gate_frames_to_gif
    continue_on_error: true
    data:
      slug: '{{ zone_slug }}'
      stamp: '{{ snapshot_timestamp }}'
      count: '{{ snapshot_frame_count | int }}'
      duration_ms: '{{ gif_frame_duration_ms | int }}'
      gif_interp_factor: 4
  - alias: Give Frigate a moment to attach face names
    delay:
      seconds: 2
  - alias: Resolve Frigate-recognized people for this visit
    if:
    - condition: template
      value_template: >-
        {% set cam = frigate_camera | default('', true) | string | trim %}
        {{ cam not in ['', 'None', 'none'] }}
    then:
    - action: shell_command.frigate_zone_people
      continue_on_error: true
      response_variable: frigate_people_cmd
      data:
        camera: '{{ frigate_camera }}'
        since_epoch: '{{ event_start_epoch }}'
        zone: "{{ frigate_zone | default('', true) }}"
        base_url: '{{ frigate_base_url }}'
  - variables:
      clip_image_files: "{% set ns = namespace(p=[]) %}{% for i in range(1, snapshot_frame_count | int + 1) %}{% set ns.p = ns.p + ['/config/www/tmp/' ~ zone_slug ~ '_' ~ snapshot_timestamp ~ '_' ~ i ~ '.jpg'] %}{% endfor %}{{ ns.p | join('\n') }}"
      notify_media_image: '{{ public_gif_url }}'
      dashboard_media_rel: '{{ clip_gif_rel }}'
      people_only_mode: "{{ people_only is true or (people_only | string | lower) in ['true', 'on', 'yes'] }}"
      # Prefer early frames for LLM — subjects often leave mid-burst; empty late frames
      # encourage CLEAR/junk. GIF still uses the full burst.
      llm_image_files: >-
        {% set ns = namespace(p=[]) %}
        {% set n = snapshot_frame_count | int %}
        {% set take = [n, 4] | min %}
        {% for i in range(1, take + 1) %}
          {% set ns.p = ns.p + ['/config/www/tmp/' ~ zone_slug ~ '_' ~ snapshot_timestamp ~ '_' ~ i ~ '.jpg'] %}
        {% endfor %}
        {{ ns.p | join('\n') }}
      recognized_people_csv: >-
        {% set ns = namespace(names=[]) %}
        {% if frigate_people_cmd is defined and frigate_people_cmd is mapping %}
          {% set raw = frigate_people_cmd.get('stdout', '') | string | trim %}
          {% if raw not in ['', 'None', 'none'] %}
            {% for part in raw.split(',') %}
              {% set n = part | trim %}
              {% if n | length > 0 and n | lower not in ['none', 'unknown', 'null'] %}
                {% set ns.names = ns.names + [n] %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endif %}
        {% set face_eid = recognized_face_sensor | default('', true) | string | trim %}
        {% if face_eid not in ['', 'None', 'none', 'unknown', 'unavailable'] %}
          {% set face = states(face_eid) | string | trim %}
          {% if face | length > 0
             and face | lower not in ['none', 'unknown', 'null', 'unavailable', '']
             and face | lower not in (ns.names | map('lower') | list) %}
            {% set ns.names = ns.names + [face] %}
          {% endif %}
        {% endif %}
        {{ ns.names | join(',') }}
      recognized_people_label: >-
        {% set parts = (recognized_people_csv | string).split(',')
           | map('trim') | reject('eq', '') | list %}
        {{ parts | join(', ') }}
      has_recognized_people: >-
        {{ 'yes' if (recognized_people_label | string | trim | length) > 0 else 'no' }}
  - action: llmvision.image_analyzer
    continue_on_error: true
    data:
      provider: !input llmvision_provider
      model: !input llmvision_model
      image_file: '{{ llm_image_files }}'
      include_filename: false
      store_in_timeline: false
      use_memory: false
      temperature: 0.1
      max_tokens: 400
      generate_title: false
      expose_images: false
      target_width: !input target_width
      message: >-
        Security camera stills from {{ zone_name }}, in time order (~{{ capture_span_seconds }}s).
        Same visit — describe only what is visibly present. Do not invent people, pets,
        objects, plates, dialogue, or actions.
        If early frames show a person/dog/vehicle and later frames are empty, they left —
        describe the early activity. Do NOT output CLEAR if any earlier frame had a person
        or vehicle.

        {% if people_only_mode == 'True' or people_only_mode == true %}
        Subject: people on the steps/entry. Ignore vehicles and pets unless a person is also clear.
        {% else %}
        Subject: people and vehicles. Mention a dog/cat only if clearly visible (never invent pets).
        For any vehicle: color + make/model if identifiable. Do NOT write license plate
        characters — Frigate LPR owns plates for notifications. Never guess plates.
        {% set kv = known_vehicle_hint | default('', true) | string | trim %}
        {% if kv | length > 0 %}
        Known vehicle names (use name only on clear visual match; never invent plates): {{ kv }}
        {% endif %}
        {% endif %}

        {% if (has_recognized_people | string | trim) == 'yes' %}
        Frigate faces this visit: {{ recognized_people_label }}. Use those names only if they
        match what you see; do not invent other names.
        {% endif %}

        Counting: unique people only. Same person across frames = one person. If unsure, prefer
        the lower count.

        Tone: brief, dry, slightly witty — but ZERO fiction. No quotes, no invented plot.

        Output exactly 3 plain-text lines (no JSON, no tools, no lists of labels):
        Line 1: one word only — PERSON or CAR or DOG or OTHER or CLEAR
        (PERSON if any human; CAR if vehicle and no person; DOG if pet only; CLEAR if nothing.)
        Line 2: factual home log ≤160 chars (who/what/where). Car color/make OK; never plate digits.
        Line 3: factual phone line ≤100 chars. Same facts, shorter.
    response_variable: ai_response
  - alias: Refresh Frigate-recognized people before notify
    if:
    - condition: template
      value_template: >-
        {% set cam = frigate_camera | default('', true) | string | trim %}
        {{ cam not in ['', 'None', 'none'] }}
    then:
    - action: shell_command.frigate_zone_people
      continue_on_error: true
      response_variable: frigate_people_cmd
      data:
        camera: '{{ frigate_camera }}'
        since_epoch: '{{ event_start_epoch }}'
        zone: "{{ frigate_zone | default('', true) }}"
        base_url: '{{ frigate_base_url }}'
  - variables:
      recognized_people_csv: >-
        {% set ns = namespace(names=[]) %}
        {% if frigate_people_cmd is defined and frigate_people_cmd is mapping %}
          {% set raw = frigate_people_cmd.get('stdout', '') | string | trim %}
          {% if raw not in ['', 'None', 'none'] %}
            {% for part in raw.split(',') %}
              {% set n = part | trim %}
              {% if n | length > 0 and n | lower not in ['none', 'unknown', 'null'] %}
                {% set ns.names = ns.names + [n] %}
              {% endif %}
            {% endfor %}
          {% endif %}
        {% endif %}
        {% set face_eid = recognized_face_sensor | default('', true) | string | trim %}
        {% if face_eid not in ['', 'None', 'none', 'unknown', 'unavailable'] %}
          {% set face = states(face_eid) | string | trim %}
          {% if face | length > 0
             and face | lower not in ['none', 'unknown', 'null', 'unavailable', '']
             and face | lower not in (ns.names | map('lower') | list) %}
            {% set ns.names = ns.names + [face] %}
          {% endif %}
        {% endif %}
        {{ ns.names | join(',') }}
      recognized_people_label: >-
        {% set parts = (recognized_people_csv | string).split(',')
           | map('trim') | reject('eq', '') | list %}
        {{ parts | join(', ') }}
      has_recognized_people: >-
        {{ 'yes' if (recognized_people_label | string | trim | length) > 0 else 'no' }}
      reply_raw: >-
        {% if ai_response is not defined or ai_response is none %}
        {% elif ai_response is mapping %}
          {% set r = ai_response.get('response_text', ai_response.get('text', '')) %}
          {% if r is mapping or (r is iterable and r is not string) %}{{ r | to_json }}{% else %}{{ r }}{% endif %}
        {% else %}
          {% set r = ai_response.response_text | default(ai_response.text, true) | default('', true) %}
          {% if r is mapping or (r is iterable and r is not string) %}{{ r | to_json }}{% else %}{{ r }}{% endif %}
        {% endif %}
      reply: >-
        {% set raw = reply_raw | string %}
        {% set cleaned = raw
          | regex_replace('(?is)```.*?```', ' ')
          | regex_replace('(?is)\\{\\s*"name"\\s*:.*?\\}\\s*', ' ')
          | regex_replace("(?is)\\{\\s*'name'\\s*:.*?\\}\\s*", ' ')
          | regex_replace('(?im)^\\s*For each image file:.*$', ' ')
          | regex_replace('(?im)^\\s*-\\s*Analyze it with.*$', ' ')
          | trim %}
        {% set ans = cleaned | regex_findall('(?is)Answer:\\s*(.*)$') %}
        {% if ans | length > 0 %}
          {{ ans[0] | trim }}
        {% else %}
          {{ cleaned }}
        {% endif %}
      llm_label: >-
        {% set text = reply | string %}
        {% set first = (text.split('\n') | first) | default('', true) | trim %}
        {% set first_only = first | regex_findall('(?i)^(PERSON|CAR|DOG|OTHER|CLEAR)\\s*[.!]?\s*$') %}
        {% if first_only | length > 0 %}
          {{ first_only[0] | upper }}
        {% else %}
          {% set first_prefix = first | regex_findall('(?i)^(PERSON|CAR|DOG|OTHER|CLEAR)\\b') %}
          {{ (first_prefix[0] | upper) if first_prefix | length > 0 else '' }}
        {% endif %}
      llm_unusable: >-
        {% set raw = reply_raw | string %}
        {% set cleaned = reply | string | trim %}
        {% set label = llm_label | string | trim | upper %}
        {% set lines = cleaned.split('\n') | map('trim') | reject('eq', '') | list %}
        {% if ai_response is not defined or ai_response is none %}
          yes
        {% elif raw | regex_findall('(?i)"name"\\s*:\\s*"(describe_image|python_m_mcp|media_understand)') | length > 0 %}
          yes
        {% elif cleaned in ['', '}', '{', "Couldn't generate content. Check logs for details.", 'None', 'none'] %}
          yes
        {% elif cleaned | regex_findall('(?i)(Describe local image files|For each frame analyzed|List the person/pet|PERSON,\\s*CAR,\\s*DOG)') | length > 0 %}
          yes
        {% elif cleaned | regex_findall('(?i)(PERSON|CAR|DOG|OTHER|CLEAR).{0,20}(PERSON|CAR|DOG|OTHER|CLEAR).{0,20}(PERSON|CAR|DOG|OTHER|CLEAR)') | length > 0 %}
          yes
        {% elif cleaned | regex_findall('(?i)(sneak(ing)? a dog|doggy got|without their owner|security alert:)') | length > 0 %}
          yes
        {% elif cleaned | regex_findall('[\"“].{8,}[\"”]') | length > 0 %}
          yes
        {% elif label not in ['PERSON', 'CAR', 'DOG', 'OTHER', 'CLEAR'] %}
          yes
        {% elif lines | length < 2 %}
          yes
        {% else %}
          no
        {% endif %}
      frigate_person: >-
        {% if (saw_person | default('no') | string | trim) == 'yes' %}
          yes
        {% else %}
          {{ 'yes' if is_state(person_sensor, 'on') else 'no' }}
        {% endif %}
      frigate_car: >-
        {% set eid = car_sensor | default('', true) | string | trim %}
        {% if (saw_car | default('no') | string | trim) == 'yes' %}
          yes
        {% elif eid in ['', 'None', 'none', 'unknown', 'unavailable'] %}
          no
        {% else %}
          {{ 'yes' if is_state(eid, 'on') else 'no' }}
        {% endif %}
      should_notify: >-
        {% set label = llm_label | string | trim | upper %}
        {% set unusable = (llm_unusable | string | trim) == 'yes' %}
        {% set only_people = people_only is true or (people_only | string | lower) in ['true', 'on', 'yes'] %}
        {% set frigate_person_hit = (frigate_person | string | trim) == 'yes' %}
        {% set frigate_car_hit = (frigate_car | string | trim) == 'yes' %}
        {% if only_people %}
          {% if unusable %}
            {{ 'yes' if frigate_person_hit else 'no' }}
          {% elif label == 'PERSON' %}
            yes
          {% else %}
            no
          {% endif %}
        {% else %}
          {% set frigate_hit = frigate_person_hit or frigate_car_hit %}
          {% if unusable %}
            {{ 'yes' if frigate_hit else 'no' }}
          {% elif label in ['PERSON', 'CAR'] %}
            yes
          {% else %}
            no
          {% endif %}
        {% endif %}
      log_description: >-
        {% set unusable = (llm_unusable | string | trim) == 'yes' %}
        {% set label = llm_label | string | trim | upper %}
        {% set people = recognized_people_label | string | trim %}
        {% set with_dog = (saw_dog | default('no') | string | trim) == 'yes' %}
        {% if unusable %}
          {% if people | length > 0 %}
            {{ (people ~ (' with dog' if with_dog else '') ~ ' at ' ~ zone_name) | truncate(160, true, '…') }}
          {% elif (frigate_person | string | trim) == 'yes' %}
            {{ (('Person with dog' if with_dog else 'Person') ~ ' at ' ~ zone_name) | truncate(160, true, '…') }}
          {% elif (frigate_car | string | trim) == 'yes' %}
            {{ ('Vehicle at ' ~ zone_name) | truncate(160, true, '…') }}
          {% else %}
            {{ (zone_name ~ ' activity') | truncate(160, true, '…') }}
          {% endif %}
        {% else %}
          {% set text = reply | string %}
          {% set sl = text.split('\n') %}
          {% set ns = namespace(cand='') %}
          {% for line in sl %}
            {% if ns.cand | length < 1 %}
              {% set t = line | trim %}
              {% set t = t
                | regex_replace('(?i)^(PERSON|CAR|DOG|OTHER|CLEAR)\\s*[.!:\\-]*\\s*', '')
                | regex_replace('(?i)^(Alert|Phone alert|Home log|Line\\s*[123])\\s*:\\s*', '')
                | regex_replace('(?i)\\b(PERSON|CAR|DOG|OTHER|CLEAR)\\b[.!:\\-]*\\s*', '')
                | regex_replace('\\s+', ' ')
                | trim %}
              {% if t | length > 8
                 and (t | regex_findall('(?i)(List the person|For each frame|Describe local|tool-call)') | length) == 0 %}
                {% set first = t.split('.')[0] | trim %}
                {% set ns.cand = (first ~ '.') if first | length > 8 else t %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if ns.cand | length > 0 %}
            {{ ns.cand | truncate(160, true, '…') }}
          {% elif people | length > 0 %}
            {{ (people ~ ' at ' ~ zone_name) | truncate(160, true, '…') }}
          {% elif label == 'PERSON' %}
            {{ ('Person at ' ~ zone_name) | truncate(160, true, '…') }}
          {% elif label == 'CAR' %}
            {{ ('Vehicle at ' ~ zone_name) | truncate(160, true, '…') }}
          {% else %}
            {{ (zone_name ~ ' activity') | truncate(160, true, '…') }}
          {% endif %}
        {% endif %}
      phone_line: >-
        {% set unusable = (llm_unusable | string | trim) == 'yes' %}
        {% if unusable %}
          {{ log_description }}
        {% else %}
          {% set sl = (reply | string).split('\n') %}
          {% set t = (sl[2] | default('', true) | trim) if sl | length > 2 else '' %}
          {% set t = t
            | regex_replace('(?i)^(PERSON|CAR|DOG|OTHER|CLEAR)\\s*[.!:\\-]*\\s*', '')
            | regex_replace('(?i)^(Alert|Phone alert|Home log|Line\\s*[123])\\s*:\\s*', '')
            | regex_replace('\\s+', ' ')
            | trim %}
          {{ t if t | length > 8 else log_description }}
        {% endif %}
      car_plate_hint: >-
        {% set ps = recognized_plate_sensor | default('', true) | string | trim %}
        {% set ns = namespace(p='') %}
        {% if ps | length > 0 %}
          {% set st = states(ps) | default('', true) | string | trim %}
          {% if st | length > 0 and (st | lower) not in ['unknown', 'unavailable', 'none', 'null'] %}
            {% set ns.p = st %}
          {% endif %}
        {% endif %}
        {{ ns.p }}
      notify_title: >-
        {% set unusable = (llm_unusable | string | trim) == 'yes' %}
        {% set label = llm_label | string | trim | upper %}
        {% set people = recognized_people_label | string | trim %}
        {% set plate = car_plate_hint | string | trim %}
        {% if people | length > 0 %}
          {{ (zone_name ~ ' · ' ~ people) | truncate(50, true, '…') }}
        {% elif unusable %}
          {% if (frigate_person | string | trim) == 'yes' %}
            {{ (zone_name ~ ' · Person') | truncate(50, true, '…') }}
          {% elif plate | length > 0 %}
            {{ (zone_name ~ ' · ' ~ plate) | truncate(50, true, '…') }}
          {% else %}
            {{ (zone_name ~ ' · Vehicle') | truncate(50, true, '…') }}
          {% endif %}
        {% elif label == 'PERSON' %}
          {{ (zone_name ~ ' · Person') | truncate(50, true, '…') }}
        {% elif label == 'CAR' %}
          {% if plate | length > 0 %}
            {{ (zone_name ~ ' · ' ~ plate) | truncate(50, true, '…') }}
          {% else %}
            {{ (zone_name ~ ' · Vehicle') | truncate(50, true, '…') }}
          {% endif %}
        {% else %}
          {{ zone_name | truncate(50, true, '…') }}
        {% endif %}
      mobile_short: >-
        {% set people = recognized_people_label | string | trim %}
        {% set phone = phone_line | string | trim %}
        {% set body = phone if phone | length > 8 else (log_description | string) %}
        {% if people | length > 0 and (people | lower) not in (body | lower) %}
          {{ (people ~ ' — ' ~ body) | truncate(100, true, '…') }}
        {% else %}
          {{ body | truncate(100, true, '…') }}
        {% endif %}
      stored_classification: >-
        {% set unusable = (llm_unusable | string | trim) == 'yes' %}
        {% set label = llm_label | string | trim | upper %}
        {% set people = recognized_people_label | string | trim %}
        {% set plate = car_plate_hint | string | trim %}
        {% if unusable %}
          {{ 'FALLBACK' ~ ((':' ~ people) if people | length > 0 else '') }}
        {% elif people | length > 0 and label == 'PERSON' %}
          {{ ('PERSON:' ~ people) | truncate(32, true, '') }}
        {% elif label == 'CAR' and plate | length > 0 %}
          {{ ('CAR:' ~ plate) | truncate(32, true, '') }}
        {% else %}
          {{ label | truncate(32, true, '') }}
        {% endif %}
  - action: input_text.set_value
    data:
      entity_id: input_text.gate_ai_last_gate
      value: '{{ zone_name }}'
  - action: input_text.set_value
    data:
      entity_id: input_text.gate_ai_last_classification
      value: '{{ stored_classification }}'
  - action: input_text.set_value
    data:
      entity_id: input_text.gate_ai_last_summary
      value: '{{ log_description | truncate(255, true, "") }}'
  - action: input_text.set_value
    data:
      entity_id: input_text.gate_ai_last_media
      value: '{{ dashboard_media_rel }}'
  - action: input_datetime.set_datetime
    data:
      entity_id: input_datetime.gate_ai_last_analysis_time
      datetime: '{{ now().strftime("%Y-%m-%d %H:%M:%S") }}'
  - if:
    - condition: template
      value_template: "{{ (should_notify | string | trim) == 'yes' }}"
    then:
    - action: persistent_notification.create
      data:
        notification_id: '{{ zone_slug }}_ai_{{ snapshot_timestamp }}'
        title: '{{ notify_title }}'
        message: |
          {{ log_description | truncate(160, true, '…') }}
          {% if (has_recognized_people | string | trim) == 'yes' %}
          Recognized: {{ recognized_people_label }}
          {% endif %}
          {% if (car_plate_hint | string | trim | length) > 0 %}
          Plate: {{ car_plate_hint }}
          {% endif %}

          ![{{ zone_name }}](/local/{{ dashboard_media_rel }})
    - action: !input notify_service
      data:
        title: '{{ notify_title }}'
        message: '{{ mobile_short }}'
        data:
          image: '{{ notify_media_image }}'
          url: !input notification_click_path
          clickAction: !input notification_click_path
          ttl: 0
          priority: high
          importance: high
          group: '{{ notify_group }}'
          channel: '{{ notify_channel }}'
          tag: '{{ zone_slug }}-{{ snapshot_timestamp }}'
          subject: >-
            {% if (has_recognized_people | string | trim) == 'yes' %}
              {{ recognized_people_label | truncate(40, true, '…') }}
            {% elif (car_plate_hint | string | trim | length) > 0 %}
              {{ car_plate_hint | truncate(40, true, '…') }}
            {% else %}
              {{ zone_name | truncate(40, true, '…') }}
            {% endif %}
          push:
            sound:
              name: default
              critical: 1
              volume: 1
  - alias: Hold until trigger sensors stay clear
    repeat:
      while:
      - condition: template
        value_template: "{{ true }}"
      sequence:
      - alias: Wait until all trigger sensors are off
        wait_template: >-
          {% set sensors = trigger_sensors if trigger_sensors is iterable and trigger_sensors is not string else [trigger_sensors] %}
          {% set ns = namespace(clear=true) %}
          {% for s in sensors %}
            {% if s is string and s | length > 0 and not is_state(s, 'off') %}
              {% set ns.clear = false %}
            {% endif %}
          {% endfor %}
          {{ ns.clear }}
      - alias: Require sustained clear (return resets the gap)
        wait_for_trigger:
        - trigger: state
          entity_id: !input trigger_sensors
          to: 'on'
        timeout:
          seconds: '{{ event_clear_seconds | int }}'
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: "{{ wait.trigger is none }}"
        then:
        - stop: Zone event ended after clear gap
