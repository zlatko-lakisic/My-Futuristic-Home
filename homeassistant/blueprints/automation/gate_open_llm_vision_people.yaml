blueprint:
  name: Gate open — Comstar Vision people alert
  description: |
    When a gate contact opens, capture several still JPEGs from the camera at short intervals (same mechanism as
    Lovelace snapshots — works with Frigate/go2rtc feeds). Those files are sent together to Comstar Vision
    **image_analyzer** (AO Reach on ADA) so the model sees multiple frames without using stream_analyzer.

    Frames are also stitched into an animated GIF (and a short MP4) under ``/config/www/tmp`` for Companion
    notifications (Android 14+ animates GIFs) and dashboard “last clip” cards.

    Notifies when classification is **PEOPLE** or **DOG**. Dogs must not be labeled as people.
    If the vision provider returns tool-call JSON / unusable text, errors, or empty output, still
    notifies with the GIF and a simple "{gate name} opened" message. Optionally falls back to
    Frigate person/dog occupancy sensors when classifying PEOPLE vs DOG vs noise.

    Configure one automation per gate (east, west, back yard) with its sensor, camera, and dashboard path.
  domain: automation
  homeassistant:
    min_version: '2024.6.0'
  input:
    gate_name:
      name: Gate name
      description: Shown in notifications and in the LLM prompt (e.g. East gate, West gate).
      selector:
        text:
    gate_slug:
      name: Snapshot file slug
      description: Safe prefix for /config/www/tmp/<slug>_timestamp_<n>.jpg used for frames and notification thumbnail (_1) (e.g. east_gate, west_gate).
      default: gate
      selector:
        text:
    gate_sensor:
      name: Gate door sensor
      description: Binary sensor that indicates the gate is open (see Gate open state).
      selector:
        entity:
          domain: binary_sensor
    gate_open_state:
      name: Gate open state
      description: State value when the gate is open (often "on").
      default: "on"
      selector:
        text:
    camera:
      name: Camera
      selector:
        entity:
          domain: camera
    frigate_person_sensor:
      name: Frigate person sensor (fallback)
      description: >
        Optional. Used when Comstar Vision returns tool-call junk or UNKNOWN.
        Prefer binary_sensor.*_person_occupancy; sensor.*_person_count also works (on if > 0).
      default: ""
      selector:
        entity:
          domain:
            - binary_sensor
            - sensor
    frigate_dog_sensor:
      name: Frigate dog sensor (fallback)
      description: >
        Optional. Latched during capture. If Frigate saw a dog and not a person, do not
        notify as a person even if the LLM says PEOPLE.
      default: ""
      selector:
        entity:
          domain:
            - binary_sensor
            - sensor
    vision_model:
      name: Vision model hint
      description: Soft model hint for Comstar Vision / ADA AO (e.g. gpt-4o-mini).
      default: gpt-4o-mini
      selector:
        text:
    target_width:
      name: Target image width (px)
      description: Downscale width sent to the model (smaller = faster upload).
      default: 1280
      selector:
        number:
          min: 512
          max: 1920
          step: 64
          mode: slider
    frame_interval_seconds:
      name: Seconds between snapshots
      description: Wait time after each frame before capturing the next (no delay before the first shot).
      default: 1
      selector:
        number:
          min: 0
          max: 10
          step: 1
          mode: slider
    stream_max_frames:
      name: Number of still frames
      description: How many JPEG snapshots to capture and send to the model (spread over ~interval × (frames − 1)).
      default: 8
      selector:
        number:
          min: 1
          max: 20
          step: 1
          mode: slider
    public_base_url:
      name: Public image URL base
      description: Must end with / — prepended to the snapshot path for the mobile image (e.g. https://example.com/local/).
      default: "https://ha.mostardesigns.com/local/"
      selector:
        text:
    notification_click_path:
      name: Dashboard path (tap / click action)
      description: Lovelace path opened from the mobile notification (url / clickAction), e.g. /backyard-yaml/backyard-east-side.
      default: /backyard-yaml/backyard
      selector:
        text:
    notify_service:
      name: Notify service
      description: Home Assistant notify service for the phone (e.g. notify.mobile_app_my_phone).
      default: notify.notify
      selector:
        text:
    notify_people:
      name: Notify people
      description: Send to all mobile-app devices registered to selected people.
      selector:
        entity:
          domain: person
          multiple: true
    property_zone_key:
      name: Property zone key (visit graph)
      description: Logical zone id (e.g. east_gate, west_gate) for visit correlation.
      default: ""
      selector:
        text:
    frigate_camera:
      name: Frigate camera name
      description: Frigate camera id for visit correlation (e.g. east_side, west_side).
      default: ""
      selector:
        text:
    visit_tracking_enabled:
      name: Cross-camera visit tracking
      default: true
      selector:
        boolean:

mode: single
variables:
  gate_name: !input gate_name
  gate_slug: !input gate_slug
  snapshot_timestamp: '{{ now().strftime("%Y%m%d-%H%M%S") }}'
  snapshot_frame_count: !input stream_max_frames
  frame_interval_seconds: !input frame_interval_seconds
  snapshot_rel: 'tmp/{{ gate_slug }}_{{ snapshot_timestamp }}_1.jpg'
  snapshot_path: '/config/www/{{ snapshot_rel }}'
  clip_gif_rel: 'tmp/{{ gate_slug }}_{{ snapshot_timestamp }}.gif'
  clip_mp4_rel: 'tmp/{{ gate_slug }}_{{ snapshot_timestamp }}.mp4'
  clip_latest_gif_rel: 'tmp/{{ gate_slug }}_latest.gif'
  public_base_url: !input public_base_url
  public_image_url: '{{ public_base_url }}{{ snapshot_rel }}'
  public_gif_url: '{{ public_base_url }}{{ clip_gif_rel }}'
  public_mp4_url: '{{ public_base_url }}{{ clip_mp4_rel }}'
  frigate_person_sensor: !input frigate_person_sensor
  frigate_dog_sensor: !input frigate_dog_sensor
  property_zone_key: !input property_zone_key
  frigate_camera: !input frigate_camera
  visit_tracking_enabled: !input visit_tracking_enabled
  event_start_epoch: '{{ as_timestamp(now()) | int }}'
triggers:
  - trigger: state
    entity_id: !input gate_sensor
    to: !input gate_open_state
actions:
  - alias: Latch Frigate occupancy at gate open
    variables:
      saw_person: >-
        {% set eid = frigate_person_sensor | default('', true) | string | trim %}
        {% if eid in ['', 'None', 'unknown', 'unavailable', '[]'] %}
          no
        {% elif eid.startswith('binary_sensor.') %}
          {{ 'yes' if is_state(eid, 'on') else 'no' }}
        {% elif eid.startswith('sensor.') %}
          {{ 'yes' if (states(eid) | float(0)) > 0 else 'no' }}
        {% else %}
          no
        {% endif %}
      saw_dog: >-
        {% set eid = frigate_dog_sensor | default('', true) | string | trim %}
        {% if eid in ['', 'None', 'unknown', 'unavailable', '[]'] %}
          no
        {% elif eid.startswith('binary_sensor.') %}
          {{ 'yes' if is_state(eid, 'on') else 'no' }}
        {% elif eid.startswith('sensor.') %}
          {{ 'yes' if (states(eid) | float(0)) > 0 else 'no' }}
        {% else %}
          no
        {% endif %}
  - repeat:
      count: '{{ snapshot_frame_count | int }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ repeat.index > 1 }}'
        then:
        - delay:
            seconds: '{{ frame_interval_seconds }}'
      - action: camera.snapshot
        target:
          entity_id: !input camera
        data:
          filename: '/config/www/tmp/{{ gate_slug }}_{{ snapshot_timestamp }}_{{ repeat.index }}.jpg'
      - alias: Keep latching occupancy during the burst
        variables:
          saw_person: >-
            {% set eid = frigate_person_sensor | default('', true) | string | trim %}
            {% if (saw_person | default('no') | string | trim) == 'yes' %}
              yes
            {% elif eid in ['', 'None', 'unknown', 'unavailable', '[]'] %}
              no
            {% elif eid.startswith('binary_sensor.') %}
              {{ 'yes' if is_state(eid, 'on') else 'no' }}
            {% elif eid.startswith('sensor.') %}
              {{ 'yes' if (states(eid) | float(0)) > 0 else 'no' }}
            {% else %}
              no
            {% endif %}
          saw_dog: >-
            {% set eid = frigate_dog_sensor | default('', true) | string | trim %}
            {% if (saw_dog | default('no') | string | trim) == 'yes' %}
              yes
            {% elif eid in ['', 'None', 'unknown', 'unavailable', '[]'] %}
              no
            {% elif eid.startswith('binary_sensor.') %}
              {{ 'yes' if is_state(eid, 'on') else 'no' }}
            {% elif eid.startswith('sensor.') %}
              {{ 'yes' if (states(eid) | float(0)) > 0 else 'no' }}
            {% else %}
              no
            {% endif %}
  - action: shell_command.gate_frames_to_gif
    continue_on_error: true
    data:
      slug: '{{ gate_slug }}'
      stamp: '{{ snapshot_timestamp }}'
      count: '{{ snapshot_frame_count | int }}'
      duration_ms: 450
      gif_interp_factor: 4
  - variables:
      clip_image_files: "{% set ns = namespace(p=[]) %}{% for i in range(1, snapshot_frame_count | int + 1) %}{% set ns.p = ns.p + ['/config/www/tmp/' ~ gate_slug ~ '_' ~ snapshot_timestamp ~ '_' ~ i ~ '.jpg'] %}{% endfor %}{{ ns.p | join('\n') }}"
      # Animated GIF for Companion (Android 14+) and dashboard; still used as fallback below.
      notify_media_image: '{{ public_gif_url }}'
      dashboard_media_rel: '{{ clip_gif_rel }}'
  - alias: Correlate gate open into property visit
    if:
    - condition: template
      value_template: >-
        {{ (visit_tracking_enabled is true or (visit_tracking_enabled | string | lower) in ['true', 'on', 'yes'])
           and (property_zone_key | default('', true) | string | trim | length) > 0
           and (frigate_camera | default('', true) | string | trim | length) > 0 }}
    then:
    - action: shell_command.visit_correlate
      continue_on_error: true
      response_variable: visit_correlate_cmd
      data:
        zone_key: '{{ property_zone_key }}'
        camera: '{{ frigate_camera }}'
        epoch: '{{ event_start_epoch }}'
        faces: ''
        gate_open: 'yes'
    - action: script.property_visit_sync_from_shell
      continue_on_error: true
      data:
        correlate_json: >-
          {% if visit_correlate_cmd is defined and visit_correlate_cmd is mapping %}
            {{ visit_correlate_cmd.get('stdout', '{}') }}
          {% else %}
            {}
          {% endif %}
  - variables:
      visit_id: >-
        {% set raw = '' %}
        {% if visit_correlate_cmd is defined and visit_correlate_cmd is mapping %}
          {% set raw = visit_correlate_cmd.get('stdout', '') | string | trim %}
        {% endif %}
        {% if raw | length > 1 and raw[:1] == '{' %}
          {% set j = raw | from_json %}
          {{ j.visit_id | default('', true) }}
        {% else %}
          {{ states('input_text.property_visit_id') | default('', true) }}
        {% endif %}
      visit_context: >-
        {% set raw = '' %}
        {% if visit_correlate_cmd is defined and visit_correlate_cmd is mapping %}
          {% set raw = visit_correlate_cmd.get('stdout', '') | string | trim %}
        {% endif %}
        {% if raw | length > 1 and raw[:1] == '{' %}
          {% set j = raw | from_json %}
          {{ j.visit_context | default('', true) }}
        {% else %}
          {{ states('input_text.property_visit_context') | default('', true) }}
        {% endif %}
      visit_priority: >-
        {% set raw = '' %}
        {% if visit_correlate_cmd is defined and visit_correlate_cmd is mapping %}
          {% set raw = visit_correlate_cmd.get('stdout', '') | string | trim %}
        {% endif %}
        {% if raw | length > 1 and raw[:1] == '{' %}
          {% set j = raw | from_json %}
          {{ j.priority | default('realtime') }}
        {% else %}
          realtime
        {% endif %}
      visit_path_label: >-
        {% set raw = '' %}
        {% if visit_correlate_cmd is defined and visit_correlate_cmd is mapping %}
          {% set raw = visit_correlate_cmd.get('stdout', '') | string | trim %}
        {% endif %}
        {% if raw | length > 1 and raw[:1] == '{' %}
          {% set j = raw | from_json %}
          {{ j.path_label | default('', true) }}
        {% else %}
          {{ states('input_text.property_visit_path_label') | default('', true) }}
        {% endif %}
  - alias: Buffer gate stills for visit narrative
    if:
    - condition: template
      value_template: "{{ (visit_id | default('', true) | string | trim | length) > 0 }}"
    then:
    - action: shell_command.visit_append_stills
      continue_on_error: true
      data:
        visit_id: '{{ visit_id }}'
        camera: '{{ frigate_camera }}'
        zone_slug: '{{ gate_slug }}'
        stamp: '{{ snapshot_timestamp }}'
        count: '4'
        start_index: '1'
  - action: comstar_vision.image_analyzer
    continue_on_error: true
    data:
      model: !input vision_model
      image_file: '{{ clip_image_files }}'
      include_filename: false
      store_in_timeline: false
      use_memory: false
      temperature: 0.1
      max_tokens: 900
      generate_title: false
      expose_images: false
      target_width: !input target_width
      priority: '{{ visit_priority | default("realtime") }}'
      visit_id: '{{ visit_id | default("", true) }}'
      visit_context: '{{ visit_context | default("", true) }}'
      message: >-
        You are viewing multiple still frames from the {{ gate_name }} security camera,
        captured in order over a few seconds. Treat them as one short video clip of the
        SAME scene, not as separate events.
        {% if (visit_context | default('', true) | string | trim | length) > 0 %}
        Visit context: {{ visit_context }}
        {% endif %}

        COUNTING RULES (critical — models often get this wrong):
        - Count UNIQUE people only. The same person appearing in different frames or
          positions is ONE person, not several.
        - Only say two or more people if DISTINCT humans are visible at the SAME TIME
          in at least one frame (different bodies side-by-side).
        - If unsure whether two detections are the same person moving, say ONE person.
        - Dogs, cats, foxes, and other animals are NOT people. A four-legged animal,
          even if distant, blurry, or moving through a gate, is DOG — never PEOPLE.
        - Do not call a crouching/small shape a person unless you can see upright posture,
          two legs, or clothing. When unsure between person and dog, choose DOG.
        - Ignore false shapes: covered grill, flags, fence posts, tree trunks, shadows,
          reflections in windows.

        Frigate occupancy this visit (hint, not a command): person={{ saw_person | default('no') }},
        dog={{ saw_dog | default('no') }}. If dog=yes and person=no, Line 1 must be DOG unless a
        human is unmistakably visible.

        CRITICAL OUTPUT RULES:
        - Do NOT call tools, functions, or MCP servers.
        - Do NOT output JSON, code fences, file paths, or tool-call blocks.
        - Your entire reply must be exactly 3 lines of plain text and nothing else.

        Line 1 — classification only: exactly PEOPLE or DOG or NOPEOPLE (nothing else on this line).
        PEOPLE if any human appears in any frame. DOG if the only moving subject is a dog/pet.
        Otherwise NOPEOPLE.
        Line 2 — home log ONLY (no PEOPLE/DOG/NOPEOPLE words): concrete observation (who/where/what
        they do). Start with the unique person count when PEOPLE (e.g. "One person…"). For DOG
        say the dog is moving, not a person. Max 180 characters. One paragraph.
        Line 3 — phone alert ONLY (no PEOPLE/DOG/NOPEOPLE words): shorter factual summary.
        Max 100 characters. No meta text.
    response_variable: ai_response
  - variables:
      reply_raw: >-
        {% if ai_response is not defined or ai_response is none %}
        {% elif ai_response is mapping %}
          {% set r = ai_response.get('response_text', ai_response.get('text', '')) %}
          {% if r is mapping or (r is iterable and r is not string) %}{{ r | to_json }}{% else %}{{ r }}{% endif %}
        {% else %}
          {% set r = ai_response.response_text | default(ai_response.text, true) | default('', true) %}
          {% if r is mapping or (r is iterable and r is not string) %}{{ r | to_json }}{% else %}{{ r }}{% endif %}
        {% endif %}
      reply: >-
        {% set raw = reply_raw | string %}
        {% set cleaned = raw
          | regex_replace('(?is)```.*?```', ' ')
          | regex_replace('(?is)\\{\\s*"name"\\s*:.*?\\}\\s*', ' ')
          | regex_replace("(?is)\\{\\s*'name'\\s*:.*?\\}\\s*", ' ')
          | regex_replace('(?im)^\\s*For each image file:.*$', ' ')
          | regex_replace('(?im)^\\s*-\\s*Analyze it with.*$', ' ')
          | trim %}
        {% set ans = cleaned | regex_findall('(?is)Answer:\\s*(.*)$') %}
        {% if ans | length > 0 %}
          {{ ans[0] | trim }}
        {% else %}
          {{ cleaned }}
        {% endif %}
      llm_label: >-
        {% set text = reply | string %}
        {% set first = (text.split('\n') | first) | default('', true) | trim %}
        {% set first_only = first | regex_findall('(?i)^(?:People\\s*:\\s*)?(NOPEOPLE|PEOPLE|DOG)\\s*[.!]?\s*$') %}
        {% if first_only | length > 0 %}
          {{ first_only[0] | upper }}
        {% else %}
          {% set first_prefix = first | regex_findall('(?i)^(?:People\\s*:\\s*)?(NOPEOPLE|PEOPLE|DOG)\\b') %}
          {% if first_prefix | length > 0 %}
            {{ first_prefix[0] | upper }}
          {% else %}
            {% set labeled = text | regex_findall('(?im)(?:^|\\n)\\s*(?:People\\s*:\\s*)?(NOPEOPLE|PEOPLE|DOG)\\b') %}
            {% if labeled | length > 0 %}
              {{ labeled[0] | upper }}
            {% else %}
              {% set exact = text | regex_findall('(?m)^\\s*(NOPEOPLE|PEOPLE|DOG)\\s*[.!]?\\s*$') %}
              {{ (exact[0] | upper) if exact | length > 0 else '' }}
            {% endif %}
          {% endif %}
        {% endif %}
      llm_unusable: >-
        {% set raw = reply_raw | string %}
        {% set cleaned = reply | string | trim %}
        {% set label = llm_label | string | trim | upper %}
        {% if ai_response is not defined or ai_response is none %}
          yes
        {% elif raw | regex_findall('(?i)"name"\\s*:\\s*"(describe_image|python_m_mcp|media_understand)') | length > 0 %}
          yes
        {% elif cleaned in ['', '}', '{', "Couldn't generate content. Check logs for details.", 'None', 'none'] %}
          yes
        {% elif cleaned | regex_findall('(?i)(Describe local image files|For each frame analyzed|List the person/pet)') | length > 0 %}
          yes
        {% elif label not in ['PEOPLE', 'DOG', 'NOPEOPLE'] %}
          yes
        {% else %}
          no
        {% endif %}
      frigate_people: >-
        {% if (saw_person | default('no') | string | trim) == 'yes' %}
          yes
        {% else %}
          {% set eid = frigate_person_sensor | default('', true) | string %}
          {% if eid in ['', 'None', 'unknown', 'unavailable', '[]'] %}
            no
          {% elif eid.startswith('binary_sensor.') %}
            {{ 'yes' if is_state(eid, 'on') else 'no' }}
          {% elif eid.startswith('sensor.') %}
            {{ 'yes' if (states(eid) | float(0)) > 0 else 'no' }}
          {% else %}
            no
          {% endif %}
        {% endif %}
      frigate_dog: >-
        {% if (saw_dog | default('no') | string | trim) == 'yes' %}
          yes
        {% else %}
          {% set eid = frigate_dog_sensor | default('', true) | string | trim %}
          {% if eid in ['', 'None', 'unknown', 'unavailable', '[]'] %}
            no
          {% elif eid.startswith('binary_sensor.') %}
            {{ 'yes' if is_state(eid, 'on') else 'no' }}
          {% elif eid.startswith('sensor.') %}
            {{ 'yes' if (states(eid) | float(0)) > 0 else 'no' }}
          {% else %}
            no
          {% endif %}
        {% endif %}
      # Clean human-readable summary — never include PEOPLE/NOPEOPLE tokens.
      log_description: >-
        {% set unusable = (llm_unusable | string | trim) == 'yes' %}
        {% set label = llm_label | string | trim | upper %}
        {% if unusable %}
          {{ gate_name }} opened
        {% else %}
          {% set text = reply | string %}
          {% set sl = text.split('\n') %}
          {% set ns = namespace(cand='') %}
          {% for line in sl %}
            {% if ns.cand | length < 1 %}
              {% set t = line | trim %}
              {% set t = t
                | regex_replace('(?i)^(?:People\\s*:\\s*)?(NOPEOPLE|PEOPLE|DOG)\\s*[.!:\\-]*\\s*', '')
                | regex_replace('(?i)^(Alert|Phone alert|Person alert|Home log|Line\\s*[123])\\s*:\\s*', '')
                | regex_replace('(?i)\\b(NOPEOPLE|PEOPLE|DOG)\\b[.!:\\-]*\\s*', '')
                | regex_replace('(?i)\\b(Phone alert|Person alert|Home log|Alert)\\s*:\\s*', '. ')
                | regex_replace('\\s+', ' ')
                | trim %}
              {% if t | length > 12
                 and (t | regex_findall('(?i)(List the person|For each frame|Describe local|tool-call)') | length) == 0 %}
                {% set first = t.split('.')[0] | trim %}
                {% set ns.cand = (first ~ '.') if first | length > 8 else t %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if ns.cand | length > 0 %}
            {{ ns.cand | truncate(140, true, '…') }}
          {% elif label == 'PEOPLE' or (frigate_people | string | trim) == 'yes' %}
            Person at {{ gate_name }}
          {% elif label == 'DOG' or (frigate_dog | string | trim) == 'yes' %}
            Dog at {{ gate_name }}
          {% else %}
            No people at {{ gate_name }}
          {% endif %}
        {% endif %}
      # PEOPLE when model sees a person; DOG when the subject is a pet; FALLBACK on junk.
      gate_classification: >-
        {% set label = llm_label | string | trim | upper %}
        {% set unusable = (llm_unusable | string | trim) == 'yes' %}
        {% set summary = log_description | string | lower %}
        {% set dog_hit = (frigate_dog | string | trim) == 'yes' %}
        {% set person_hit = (frigate_people | string | trim) == 'yes' %}
        {% set dog_in_text = summary | regex_findall('(?i)\\b(dog|puppy|canine|pet|animal)\\b') | length > 0 %}
        {% set describes_person = summary | regex_findall('(?i)\\b(person|people|someone|man|woman|child|human)\\b') | length > 0
           and summary | regex_findall('(?i)\\bno (person|people)\\b') | length == 0
           and 'opened' not in summary %}
        {% if unusable %}
          {% if person_hit %}
            PEOPLE
          {% elif dog_hit %}
            DOG
          {% else %}
            FALLBACK
          {% endif %}
        {% elif label == 'PEOPLE' and not person_hit and (dog_hit or dog_in_text) %}
          DOG
        {% elif label == 'NOPEOPLE' and describes_person and not dog_hit and not dog_in_text %}
          PEOPLE
        {% elif label == 'NOPEOPLE' and (dog_hit or dog_in_text) %}
          DOG
        {% elif label in ['PEOPLE', 'DOG', 'NOPEOPLE'] %}
          {{ label }}
        {% elif dog_hit and not person_hit %}
          DOG
        {% else %}
          FALLBACK
        {% endif %}
      notify_title: >-
        {% set vpath = visit_path_label | default('', true) | string | trim %}
        {% if gate_classification == 'PEOPLE' %}
          {% if vpath | length > 0 and ' → ' in vpath %}
            {{ (gate_name ~ ' · ' ~ vpath) | truncate(50, true, '…') }}
          {% else %}
            {% set s = log_description | string %}
            {% set short = s | regex_findall('(?i)^((?:one|two|three|\\d+)\\s+people?[^.]*)') %}
            {% if short | length > 0 %}
              {{ gate_name }} · {{ short[0] | truncate(40, true, '…') }}
            {% else %}
              {{ gate_name }} · Person
            {% endif %}
          {% endif %}
        {% elif gate_classification == 'DOG' %}
          {{ gate_name }} · Dog
        {% else %}
          {{ gate_name }} opened
        {% endif %}
      mobile_short: >-
        {% if gate_classification in ['PEOPLE', 'DOG'] %}
          {{ log_description | truncate(120, true, '…') }}
        {% else %}
          {{ gate_name }} opened
        {% endif %}
      should_notify: >-
        {{ 'yes' if gate_classification in ['PEOPLE', 'DOG', 'FALLBACK'] else 'no' }}
      notify_services: >-
        {% set ns = namespace(services=[]) %}
        {% for p in (notify_people | default([], true)) %}
          {% for dt in state_attr(p, 'device_trackers') | default([], true) %}
            {% if dt is string and dt.startswith('device_tracker.') %}
              {% set slug = dt | replace('device_tracker.', '') %}
              {% set ent = 'notify.' ~ slug %}
              {% if states(ent) not in ['unknown', 'unavailable'] and ent not in ns.services %}
                {% set ns.services = ns.services + [ent] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {{ ns.services | to_json }}
  - alias: Drop person wording when this visit is a dog
    variables:
      log_description: >-
        {% if gate_classification != 'DOG' %}
          {{ log_description }}
        {% else %}
          {% set t = log_description | string
            | regex_replace('(?i)\\b(a |an )?(person|people|someone|man|woman|child|human)\\b', 'a dog')
            | regex_replace('(?i)\\bone a dog\\b', 'A dog')
            | regex_replace('\\s+', ' ')
            | trim %}
          {% if 'dog' in (t | lower) %}
            {{ t | truncate(140, true, '…') }}
          {% else %}
            Dog at {{ gate_name }}
          {% endif %}
        {% endif %}
  - alias: Refresh phone line from rewritten log
    variables:
      mobile_short: >-
        {% if gate_classification in ['PEOPLE', 'DOG'] %}
          {{ log_description | truncate(120, true, '…') }}
        {% else %}
          {{ gate_name }} opened
        {% endif %}
  - action: input_text.set_value
    continue_on_error: true
    data:
      entity_id: input_text.gate_ai_last_gate
      value: '{{ gate_name }}'
  - action: input_text.set_value
    continue_on_error: true
    data:
      entity_id: input_text.gate_ai_last_classification
      value: '{{ gate_classification }}'
  - action: input_text.set_value
    continue_on_error: true
    data:
      entity_id: input_text.gate_ai_last_summary
      value: '{{ log_description | truncate(255, true, "") }}'
  - action: input_text.set_value
    continue_on_error: true
    data:
      entity_id: input_text.gate_ai_last_media
      value: '{{ dashboard_media_rel }}'
  - action: input_datetime.set_datetime
    continue_on_error: true
    data:
      entity_id: input_datetime.gate_ai_last_analysis_time
      datetime: '{{ now().strftime("%Y-%m-%d %H:%M:%S") }}'
  - if:
    - condition: template
      value_template: "{{ (should_notify | string | trim) == 'yes' }}"
    then:
    - action: persistent_notification.create
      data:
        notification_id: '{{ gate_slug }}_ai_{{ snapshot_timestamp }}'
        title: '{{ notify_title }}'
        message: |
          {{ log_description }}

          ![{{ gate_name }}](/local/{{ dashboard_media_rel }})
    - action: !input notify_service
      data:
        title: '{{ notify_title }}'
        message: '{{ mobile_short }}'
        data:
          image: '{{ notify_media_image }}'
          url: !input notification_click_path
          clickAction: !input notification_click_path
          ttl: 0
          priority: high
          importance: high
          group: ha-gates
          channel: HA Gates
          push:
            sound:
              name: default
              critical: 1
              volume: 1
