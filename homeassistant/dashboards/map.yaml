# Map — track GPS people and companion devices
#
# Includes person entities + companion app device_trackers with source_type gps.
# Router/Unifi presence trackers are excluded (no coordinates).
views:
  - title: Live Map
    path: map
    icon: mdi:map-marker-radius
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:layout-card
            layout_type: custom:grid-layout
            grid_options:
              columns: full
            layout:
              width: 100%
              max_width: 100%
              padding: 8px 16px 4px
              margin: 0
              grid-template-columns: minmax(0, 3fr) minmax(280px, 1fr)
              grid-template-rows: auto
              grid-template-areas: |
                "map status"
              grid-gap: 12px 16px
              place-items: stretch
              mediaquery:
                "(max-width: 1100px)":
                  grid-template-columns: 100%
                  grid-template-areas: |
                    "map"
                    "status"
            cards:
              - type: vertical-stack
                view_layout:
                  grid-area: map
                cards:
                  - type: heading
                    heading: Live Map
                    heading_style: title
                    icon: mdi:map
                  - type: map
                    auto_fit: true
                    fit_zones: true
                    default_zoom: 14
                    aspect_ratio: "16:9"
                    hours_to_show: 24
                    entities:
                      - entity: zone.home
                      - entity: person.zlatko_lakisic
                        name: Zlatko
                      - entity: person.adna_zujo_lakisic
                        name: Adna
                      - entity: person.ibrica_lakisic
                        name: Ibrica
                      - entity: person.md_admin
                        name: md-admin
                      - entity: device_tracker.zlatko_galaxy
                        name: Zlatko Galaxy
                      - entity: device_tracker.zlatko_fold
                        name: Zlatko Fold 5
                      - entity: device_tracker.adna_s24_ultra
                        name: Adna S24 Ultra
                      - entity: device_tracker.adna_samsung
                        name: Adna Samsung
                      - entity: device_tracker.ibrica_samsung
                        name: Ibrica Samsung
                      - entity: device_tracker.adna_s_ipad
                        name: Adna's iPad
                      - entity: device_tracker.adna_ipad
                        name: Adna iPad
                      - entity: device_tracker.kiosk_ipad
                        name: Kiosk iPad
                      - entity: device_tracker.vz_darkside
                        name: VZ Darkside
                      - entity: device_tracker.vz_darkside_2
                        name: VZ-Darkside

              - type: vertical-stack
                view_layout:
                  grid-area: status
                cards:
                  - type: heading
                    heading: People
                    heading_style: title
                    icon: mdi:account-group
                  - type: entities
                    show_header_toggle: false
                    entities:
                      - entity: person.zlatko_lakisic
                        name: Zlatko
                        secondary_info: last-changed
                      - entity: person.adna_zujo_lakisic
                        name: Adna
                        secondary_info: last-changed
                      - entity: person.ibrica_lakisic
                        name: Ibrica
                        secondary_info: last-changed
                      - entity: person.md_admin
                        name: md-admin
                        secondary_info: last-changed
                  - type: heading
                    heading: Home zone
                    heading_style: title
                    icon: mdi:home-map-marker
                  - type: tile
                    entity: zone.home
                    name: Home
                    icon: mdi:home
                    vertical: false

          - type: heading
            heading: Trackable devices
            heading_style: title
            icon: mdi:cellphone-marker

          - type: custom:layout-card
            layout_type: custom:grid-layout
            grid_options:
              columns: full
            layout:
              width: 100%
              max_width: 100%
              padding: 0 16px 8px
              grid-template-columns: repeat(5, minmax(0, 1fr))
              grid-gap: 8px
              place-items: stretch
              mediaquery:
                "(max-width: 1100px)":
                  grid-template-columns: repeat(3, minmax(0, 1fr))
                "(max-width: 700px)":
                  grid-template-columns: repeat(2, minmax(0, 1fr))
            cards:
              - type: tile
                entity: device_tracker.zlatko_galaxy
                name: Zlatko Galaxy
                icon: mdi:cellphone
                vertical: true
                color: green
              - type: tile
                entity: device_tracker.zlatko_fold
                name: Zlatko Fold 5
                icon: mdi:cellphone
                vertical: true
                color: green
              - type: tile
                entity: device_tracker.adna_s24_ultra
                name: Adna S24 Ultra
                icon: mdi:cellphone
                vertical: true
                color: green
              - type: tile
                entity: device_tracker.adna_samsung
                name: Adna Samsung
                icon: mdi:cellphone
                vertical: true
                color: green
              - type: tile
                entity: device_tracker.ibrica_samsung
                name: Ibrica Samsung
                icon: mdi:cellphone
                vertical: true
                color: green
              - type: tile
                entity: device_tracker.adna_s_ipad
                name: Adna's iPad
                icon: mdi:tablet
                vertical: true
                color: blue
              - type: tile
                entity: device_tracker.adna_ipad
                name: Adna iPad
                icon: mdi:tablet
                vertical: true
                color: blue
              - type: tile
                entity: device_tracker.kiosk_ipad
                name: Kiosk iPad
                icon: mdi:tablet-dashboard
                vertical: true
                color: blue
              - type: tile
                entity: device_tracker.vz_darkside
                name: VZ Darkside
                icon: mdi:tablet-cellphone
                vertical: true
                color: blue
              - type: tile
                entity: device_tracker.vz_darkside_2
                name: VZ-Darkside
                icon: mdi:tablet-cellphone
                vertical: true
                color: blue

  - title: Batteries & Locations
    path: details
    icon: mdi:battery-charging
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: heading
            heading: Battery levels
            heading_style: title
            icon: mdi:battery

          - type: custom:layout-card
            layout_type: custom:grid-layout
            grid_options:
              columns: full
            layout:
              width: 100%
              max_width: 100%
              padding: 0 16px 8px
              grid-template-columns: repeat(5, minmax(0, 1fr))
              grid-gap: 8px
              place-items: stretch
              mediaquery:
                "(max-width: 1100px)":
                  grid-template-columns: repeat(3, minmax(0, 1fr))
                "(max-width: 700px)":
                  grid-template-columns: repeat(2, minmax(0, 1fr))
            cards:
              - type: tile
                entity: sensor.zlatko_galaxy_battery_level
                name: Zlatko Galaxy
                icon: mdi:battery
                vertical: true
              - type: tile
                entity: sensor.zlatko_fold_5_battery_level
                name: Zlatko Fold 5
                icon: mdi:battery
                vertical: true
              - type: tile
                entity: sensor.adna_s24_ultra_battery_level
                name: Adna S24 Ultra
                icon: mdi:battery
                vertical: true
              - type: tile
                entity: sensor.ibrica_samsung_battery_level
                name: Ibrica Samsung
                icon: mdi:battery
                vertical: true
              - type: tile
                entity: sensor.adna_s_ipad_battery_level
                name: Adna's iPad
                icon: mdi:battery
                vertical: true
              - type: tile
                entity: sensor.adna_ipad_battery_level
                name: Adna iPad
                icon: mdi:battery
                vertical: true
              - type: tile
                entity: sensor.kiosk_ipad_battery_level
                name: Kiosk iPad
                icon: mdi:battery
                vertical: true
              - type: tile
                entity: sensor.vz_darkside_battery_level
                name: VZ Darkside
                icon: mdi:battery
                vertical: true
              - type: tile
                entity: sensor.vz_darkside_battery_level_2
                name: VZ-Darkside
                icon: mdi:battery
                vertical: true

          - type: heading
            heading: Geocoded locations
            heading_style: title
            icon: mdi:map-search

          - type: custom:layout-card
            layout_type: custom:grid-layout
            grid_options:
              columns: full
            layout:
              width: 100%
              max_width: 100%
              padding: 0 16px 20px
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-gap: 8px
              place-items: stretch
              mediaquery:
                "(max-width: 700px)":
                  grid-template-columns: 100%
            cards:
              - type: entities
                title: Phones
                show_header_toggle: false
                entities:
                  - entity: sensor.zlatko_galaxy_geocoded_location
                    name: Zlatko Galaxy
                    secondary_info: last-changed
                  - entity: sensor.zlatko_fold_5_geocoded_location
                    name: Zlatko Fold 5
                    secondary_info: last-changed
                  - entity: sensor.ibrica_samsung_geocoded_location
                    name: Ibrica Samsung
                    secondary_info: last-changed
                  - entity: sensor.zlatko_galaxy_detected_activity
                    name: Zlatko activity
                  - entity: sensor.ibrica_samsung_detected_activity
                    name: Ibrica activity
              - type: entities
                title: Tablets
                show_header_toggle: false
                entities:
                  - entity: sensor.adna_s_ipad_geocoded_location
                    name: Adna's iPad
                    secondary_info: last-changed
                  - entity: sensor.vz_darkside_geocoded_location
                    name: VZ Darkside
                    secondary_info: last-changed
                  - entity: sensor.adna_s_ipad_activity
                    name: Adna's iPad activity
                  - entity: sensor.vz_darkside_activity
                    name: VZ Darkside activity
                  - entity: sensor.vz_darkside_last_update_trigger
                    name: VZ Darkside last update
