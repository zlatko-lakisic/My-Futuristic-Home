# Map — one marker per person (GPS from linked phone / geocode fallback)
#
# Device trackers are not plotted separately; each person is linked to one
# companion device (plus optional geocode fallback) in the Person settings.
views:
  - title: Live Map
    path: map
    icon: mdi:map-marker-radius
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:layout-card
            layout_type: custom:grid-layout
            grid_options:
              columns: full
            layout:
              width: 100%
              max_width: 100%
              padding: 8px 16px 4px
              margin: 0
              grid-template-columns: minmax(0, 3fr) minmax(280px, 1fr)
              grid-template-rows: auto
              grid-template-areas: |
                "map status"
              grid-gap: 12px 16px
              place-items: stretch
              mediaquery:
                "(max-width: 1100px)":
                  grid-template-columns: 100%
                  grid-template-areas: |
                    "map"
                    "status"
            cards:
              - type: vertical-stack
                view_layout:
                  grid-area: map
                cards:
                  - type: heading
                    heading: Live Map
                    heading_style: title
                    icon: mdi:map
                  - type: map
                    auto_fit: true
                    fit_zones: true
                    default_zoom: 14
                    aspect_ratio: "16:9"
                    hours_to_show: 24
                    entities:
                      - entity: zone.home
                      - entity: person.zlatko_lakisic
                        name: Zlatko
                      - entity: person.adna_zujo_lakisic
                        name: Adna
                      - entity: person.ibrica_lakisic
                        name: Ibrica

              - type: vertical-stack
                view_layout:
                  grid-area: status
                cards:
                  - type: heading
                    heading: People
                    heading_style: title
                    icon: mdi:account-group
                  - type: entities
                    show_header_toggle: false
                    entities:
                      - entity: person.zlatko_lakisic
                        name: Zlatko
                        secondary_info: last-changed
                      - entity: person.adna_zujo_lakisic
                        name: Adna
                        secondary_info: last-changed
                      - entity: person.ibrica_lakisic
                        name: Ibrica
                        secondary_info: last-changed
                  - type: heading
                    heading: Home zone
                    heading_style: title
                    icon: mdi:home-map-marker
                  - type: tile
                    entity: zone.home
                    name: Home
                    icon: mdi:home
                    vertical: false

          - type: heading
            heading: Linked phones
            heading_style: title
            icon: mdi:cellphone-marker

          - type: custom:layout-card
            layout_type: custom:grid-layout
            grid_options:
              columns: full
            layout:
              width: 100%
              max_width: 100%
              padding: 0 16px 8px
              grid-template-columns: repeat(3, minmax(0, 1fr))
              grid-gap: 8px
              place-items: stretch
              mediaquery:
                "(max-width: 700px)":
                  grid-template-columns: repeat(2, minmax(0, 1fr))
            cards:
              - type: tile
                entity: device_tracker.zlatko_galaxy
                name: Zlatko · Galaxy
                icon: mdi:cellphone
                vertical: true
                color: green
              - type: tile
                entity: device_tracker.adna_s24_ultra
                name: Adna · S24 Ultra
                icon: mdi:cellphone
                vertical: true
                color: green
              - type: tile
                entity: device_tracker.ibrica_samsung
                name: Ibrica · Samsung
                icon: mdi:cellphone
                vertical: true
                color: green

  - title: Batteries & Locations
    path: details
    icon: mdi:battery-charging
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: heading
            heading: Battery levels
            heading_style: title
            icon: mdi:battery

          - type: custom:layout-card
            layout_type: custom:grid-layout
            grid_options:
              columns: full
            layout:
              width: 100%
              max_width: 100%
              padding: 0 16px 8px
              grid-template-columns: repeat(3, minmax(0, 1fr))
              grid-gap: 8px
              place-items: stretch
              mediaquery:
                "(max-width: 700px)":
                  grid-template-columns: repeat(2, minmax(0, 1fr))
            cards:
              - type: tile
                entity: sensor.zlatko_galaxy_battery_level
                name: Zlatko Galaxy
                icon: mdi:battery
                vertical: true
              - type: tile
                entity: sensor.adna_s24_ultra_battery_level
                name: Adna S24 Ultra
                icon: mdi:battery
                vertical: true
              - type: tile
                entity: sensor.ibrica_samsung_battery_level
                name: Ibrica Samsung
                icon: mdi:battery
                vertical: true

          - type: heading
            heading: Geocoded locations
            heading_style: title
            icon: mdi:map-search

          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.zlatko_galaxy_geocoded_location
                name: Zlatko Galaxy
                secondary_info: last-changed
              - entity: sensor.ibrica_samsung_geocoded_location
                name: Ibrica Samsung
                secondary_info: last-changed
              - entity: sensor.zlatko_galaxy_detected_activity
                name: Zlatko activity
              - entity: sensor.ibrica_samsung_detected_activity
                name: Ibrica activity
