                        service_data:
                          entity_id: input_select.qbittorrent_active_sort
                          option: upload
                  eta:
                    card:
                      type: custom:button-card
                      template: torrent_sort_header_btn
                      name: |
                        [[[
                          const on = states['input_select.qbittorrent_active_sort'].state === 'eta';
