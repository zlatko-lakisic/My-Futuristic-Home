                  dl:
                    card:
                      type: custom:button-card
                      template: torrent_sort_header_btn
                      name: |
                        [[[
                          const on = states['input_select.qbittorrent_active_sort'].state === 'download';
                          return on ? '↓ DL ▾' : '↓ DL';
                        ]]]
                      styles:
                        name:
                          - justify-self: end
                          - color: |
                              [[[
                                return entity.state === 'download' ? '#90caf9' : '#42a5f5';
                              ]]]
                      tap_action:
                        action: call-service
                        service: input_select.select_option
                        service_data:
                          entity_id: input_select.qbittorrent_active_sort
                          option: download
                  ul:
                    card:
