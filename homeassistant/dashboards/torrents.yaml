# QBITTORRENT DOWNLOAD STATION — Lovelace (YAML mode)
#
# Sections view (same padding/margins as home_control.yaml).
#
# Requires the same custom cards / resources as infrastructure.yaml:
#   layout-card, button-card, statistics-graph-chart-card, modern-circular-gauge
#
# qBittorrent Plus (HACS): instance sensors + hybrid active-torrent entities.
# Speed gauges & transfer chart use template sensors (KiB/s): see packages/qbittorrent_speed_k.yaml.
# Active transfers: auto-entities + button-card rows; sort via input_select.qbittorrent_active_sort.
# Tapping a row opens the Radarr/Sonarr detail sheet (last two cards in the section) via
# input_text.torrent_detail_hash; metadata from sensor.arr_download_details. The sheet is
# dismissed by the backdrop card only, never by taps on the sheet itself. Hold a row for
# the qBittorrent more-info dialog (pause/resume).
# Responsive: layout-card + button-card extra_styles @media (1100px / 700px / 600px).

button_card_templates:
  torrent_transfer_row:
    show_icon: false
    show_name: false
    show_state: false
    triggers_update: all
    # Tap stores this torrent's infohash in input_text.torrent_detail_hash, which the
    # detail sheet at the bottom of this view renders. Hold still opens the qBittorrent
    # more-info dialog for pause/resume.
    tap_action:
      action: call-service
      service: input_text.set_value
      service_data:
        entity_id: input_text.torrent_detail_hash
        value: |
          [[[
            const slug = entity.entity_id.slice(7, -8);
            const st = hass.states[`sensor.${slug}_state`];
            return String((st && st.attributes.torrent_hash) || '').toUpperCase();
          ]]]
    hold_action:
      action: more-info
    styles:
      card:
        - background: transparent
        - border: none
        - border-radius: 0
        - box-shadow: none
        - padding: 8px 14px
        - border-bottom: 1px solid rgba(255,255,255,0.06)
      grid:
        - grid-template-areas: '"title cat prog dl ul eta size sp"'
        - grid-template-columns: minmax(0, 1.6fr) 80px 100px 88px 88px 68px 72px 56px
        - align-items: center
        - column-gap: 10px
      custom_fields:
        title:
          - justify-self: stretch
          - align-self: center
          - min-width: 0
          - max-width: 100%
          - width: 100%
          - overflow: hidden
        cat:
          - justify-self: center
        prog:
          - justify-self: stretch
        dl:
          - justify-self: end
          - font-family: ui-monospace, SFMono-Regular, Menlo, monospace
          - font-size: 0.76rem
          - font-weight: 600
        ul:
          - justify-self: end
          - font-family: ui-monospace, SFMono-Regular, Menlo, monospace
          - font-size: 0.76rem
          - font-weight: 600
        eta:
          - justify-self: end
          - font-family: ui-monospace, SFMono-Regular, Menlo, monospace
          - font-size: 0.76rem
          - color: "#cfd8dc"
        size:
          - justify-self: end
          - font-family: ui-monospace, SFMono-Regular, Menlo, monospace
          - font-size: 0.76rem
          - color: "#cfd8dc"
        sp:
          - justify-self: end
          - font-family: ui-monospace, SFMono-Regular, Menlo, monospace
          - font-size: 0.76rem
    extra_styles: |
      #container {
        width: 100%;
        min-width: 0;
      }
      #title {
        min-width: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
        overflow: hidden !important;
      }
      #title .torrent-title-row {
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
      }
      #title .torrent-title-text {
        min-width: 0;
        flex: 1 1 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @media (max-width: 1100px) {
        #container {
          grid-template-areas: "title title title cat" "prog dl ul eta" "size sp . ." !important;
          grid-template-columns: 1.2fr 1fr 1fr 1fr !important;
          row-gap: 8px !important;
          column-gap: 8px !important;
        }
      }
      @media (max-width: 700px) {
        #container {
          grid-template-areas: "title title" "cat prog" "dl ul" "eta size" "sp sp" !important;
          grid-template-columns: 1fr 1fr !important;
          row-gap: 10px !important;
          column-gap: 10px !important;
          align-items: center !important;
        }
        #title { justify-self: stretch !important; }
        #cat { justify-self: start !important; }
        #prog { justify-self: stretch !important; }
        #dl { justify-self: start !important; font-size: 0.8rem !important; }
        #ul { justify-self: end !important; font-size: 0.8rem !important; }
        #eta { justify-self: start !important; font-size: 0.8rem !important; }
        #size { justify-self: end !important; font-size: 0.8rem !important; }
        #sp { justify-self: start !important; font-size: 0.8rem !important; }
      }
    custom_fields:
      title: |
        [[[
          const slug = entity.entity_id.slice(7, -8);
          const st = hass.states[`sensor.${slug}_state`];
          const name = (st && (st.attributes.torrent_name || st.attributes.friendly_name)) || slug;
          const clean = String(name).replace(/ State$/, '');
          const hash = String((st && st.attributes.torrent_hash) || '').toUpperCase();
          const posterEnt = hass.states['sensor.arr_download_posters'];
          const posters = (posterEnt && posterEnt.attributes.by_hash) || {};
          let url = posters[hash] || '';
          if (!url && posterEnt && posterEnt.attributes.by_title) {
            url = posterEnt.attributes.by_title[clean.toLowerCase()] || '';
          }
          const esc = (s) => String(s)
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;');
          const narrow = window.matchMedia('(max-width: 700px)').matches;
          const pw = narrow ? 36 : 40;
          const ph = narrow ? 52 : 58;
          const art = url
            ? `<img src="${esc(url)}" alt="" referrerpolicy="no-referrer" style="width:${pw}px;height:${ph}px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#333;box-shadow:0 1px 4px rgba(0,0,0,.4);" />`
            : `<div style="width:${pw}px;height:${ph}px;border-radius:6px;flex-shrink:0;background:rgba(255,255,255,.08);"></div>`;
          return `<div class="torrent-title-row" style="display:flex;align-items:center;gap:12px;min-width:0;max-width:100%;width:100%;overflow:hidden;">
            ${art}
            <div class="torrent-title-text" style="min-width:0;flex:1 1 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:${narrow ? '0.86' : '0.88'}rem;color:#f1f3f4;" title="${esc(clean)}">${esc(clean)}</div>
          </div>`;
        ]]]
      cat: |
        [[[
          const slug = entity.entity_id.slice(7, -8);
          const st = hass.states[`sensor.${slug}_state`];
          const cat = String((st && st.attributes.category) || '').toLowerCase();
          let label = '—', color = '#9aa0a6', bg = 'rgba(154,160,166,.14)';
          if (cat.includes('radarr')) { label = 'Movie'; color = '#42a5f5'; bg = 'rgba(66,165,245,.18)'; }
          else if (cat.includes('sonarr')) { label = 'TV'; color = '#26a69a'; bg = 'rgba(38,166,154,.18)'; }
          else if (cat) { label = cat.slice(0, 12); }
          return `<span style="display:inline-block;padding:4px 10px;border-radius:999px;font-size:0.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:${color};background:${bg};">${label}</span>`;
        ]]]
      prog: |
        [[[
          const slug = entity.entity_id.slice(7, -8);
          const pe = hass.states[`sensor.${slug}_progress`];
          const st = hass.states[`sensor.${slug}_state`];
          const stateL = String(st ? st.state : '').toLowerCase();
          let n = pe && !['unknown','unavailable','none',''].includes(String(pe.state)) ? Number(pe.state) : 0;
          if (!Number.isFinite(n)) n = 0;
          n = Math.max(0, Math.min(100, n));
          let bar = '#66bb6a';
          if (n < 100) {
            if (stateL.includes('stall')) bar = '#ffa726';
            else if (stateL.includes('upload') || stateL === 'up') bar = '#66bb6a';
            else bar = '#42a5f5';
          }
          const txt = pe && !['unknown','unavailable','none',''].includes(String(pe.state)) ? `${n.toFixed(1)}%` : '—';
          return `<div>
            <div style="font-size:0.78rem;font-weight:700;color:${bar};margin-bottom:5px;">${txt}</div>
            <div style="height:7px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;">
              <div style="height:100%;width:${n}%;background:${bar};border-radius:999px;"></div>
            </div>
          </div>`;
        ]]]
      dl: |
        [[[
          const slug = entity.entity_id.slice(7, -8);
          const e = hass.states[`sensor.${slug}_download_speed`];
          const narrow = window.matchMedia('(max-width: 700px)').matches;
          const label = narrow ? '<span style="opacity:.55;font-size:0.65rem;margin-right:6px;">↓</span>' : '';
          if (!e || ['unknown','unavailable'].includes(e.state)) return `${label}<span style="color:#78909c;">—</span>`;
          const n = Number(e.state) || 0;
          const u = e.attributes.unit_of_measurement || '';
          const c = n > 0 ? '#42a5f5' : '#78909c';
          return `${label}<span style="color:${c};">${n.toFixed(1)}&nbsp;${u}</span>`;
        ]]]
      ul: |
        [[[
          const slug = entity.entity_id.slice(7, -8);
          const e = hass.states[`sensor.${slug}_upload_speed`];
          const narrow = window.matchMedia('(max-width: 700px)').matches;
          const label = narrow ? '<span style="opacity:.55;font-size:0.65rem;margin-right:6px;">↑</span>' : '';
          if (!e || ['unknown','unavailable'].includes(e.state)) return `${label}<span style="color:#78909c;">—</span>`;
          const n = Number(e.state) || 0;
          const u = e.attributes.unit_of_measurement || '';
          const c = n > 0 ? '#66bb6a' : '#78909c';
          return `${label}<span style="color:${c};">${n.toFixed(1)}&nbsp;${u}</span>`;
        ]]]
      eta: |
        [[[
          const slug = entity.entity_id.slice(7, -8);
          const e = hass.states[`sensor.${slug}_eta`];
          const narrow = window.matchMedia('(max-width: 700px)').matches;
          const label = narrow ? '<span style="opacity:.55;font-size:0.65rem;margin-right:6px;">ETA</span>' : '';
          if (!e || ['unknown','unavailable','none',''].includes(String(e.state))) return `${label}—`;
          const n = parseInt(e.state, 10);
          let txt = '∞';
          if (Number.isFinite(n) && n > 0 && n < 8640000) {
            if (n >= 86400) txt = `${Math.floor(n/86400)}d ${Math.floor((n%86400)/3600)}h`;
            else if (n >= 3600) txt = `${Math.floor(n/3600)}h ${Math.floor((n%3600)/60)}m`;
            else if (n >= 60) txt = `${Math.floor(n/60)}m`;
            else txt = `${n}s`;
          }
          return `${label}${txt}`;
        ]]]
      size: |
        [[[
          const slug = entity.entity_id.slice(7, -8);
          const e = hass.states[`sensor.${slug}_size`];
          const narrow = window.matchMedia('(max-width: 700px)').matches;
          const label = narrow ? '<span style="opacity:.55;font-size:0.65rem;margin-right:6px;">Size</span>' : '';
          if (!e || ['unknown','unavailable'].includes(e.state)) return `${label}—`;
          const n = Number(e.state) || 0;
          const u = e.attributes.unit_of_measurement || '';
          return `${label}${n.toFixed(2)}&nbsp;${u}`;
        ]]]
      sp: |
        [[[
          const slug = entity.entity_id.slice(7, -8);
          const seeds = hass.states[`sensor.${slug}_seeds`];
          const peers = hass.states[`sensor.${slug}_peers`];
          const narrow = window.matchMedia('(max-width: 700px)').matches;
          const label = narrow ? '<span style="opacity:.55;font-size:0.65rem;margin-right:6px;">S/P</span>' : '';
          const s = seeds ? seeds.state : '—';
          const p = peers ? peers.state : '—';
          return `${label}<span style="color:#81c784;">${s}</span><span style="color:#5f6b73;">/</span><span style="color:#64b5f6;">${p}</span>`;
        ]]]

  torrent_sort_header_btn:
    entity: input_select.qbittorrent_active_sort
    show_icon: false
    show_state: false
    show_name: true
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - border-radius: 0
        - padding: 0
        - margin: 0
        - height: auto
        - min-height: 0
      name:
        - font-size: 0.92rem
        - font-weight: 700
        - letter-spacing: 0.06em
        - text-transform: uppercase
        - white-space: nowrap
        - justify-self: end

views:
  - title: Torrents
    path: torrents
    icon: mdi:download-network
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading_style: title
            heading: QBITTORRENT DOWNLOAD STATION

          - type: heading
            heading_style: subtitle
            icon: mdi:speedometer
            heading: Session & transfer speed

          # Responsive gauges/charts. Gauge max: Mostar path caps when proxied.
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(4, minmax(0, 1fr))
              grid-gap: 12px
              mediaquery:
                "(max-width: 1100px)":
                  grid-template-columns: repeat(2, minmax(0, 1fr))
                "(max-width: 600px)":
                  grid-template-columns: 1fr
            grid_options:
              columns: full
            cards:
              - type: custom:modern-circular-gauge
                entity: sensor.qbittorrent_download_speed_kib
                name: Leeching
                gauge_type: standard
                needle: false
                smooth_segments: true
                min: 0
                max: >
                  {% if is_state('binary_sensor.qbittorrent_proxied_via_mostar', 'on') %}
                    200
                  {% else %}
                    10240
                  {% endif %}
                height: 200
                show_icon: true
                icon: mdi:download
                header_position: top
                show_header: false
                state_font_size: 22
                gauge_radius: 40
                decimals: 1
                gauge_background_style:
                  width: 10
                  opacity: 0.7
                gauge_foreground_style:
                  width: 8
                  color: adaptive
                adaptive_icon_color: true
                segments:
                  - from: 0
                    color:
                      - 33
                      - 150
                      - 243
                  - from: 50
                    color:
                      - 3
                      - 169
                      - 244
                  - from: 100
                    color:
                      - 0
                      - 188
                      - 212
                  - from: 150
                    color:
                      - 128
                      - 222
                      - 234
                  - from: 200
                    color:
                      - 179
                      - 229
                      - 252
                secondary: Leeching
                tap_action:
                  action: more-info
              - type: custom:modern-circular-gauge
                entity: sensor.qbittorrent_upload_speed_kib
                name: Seeding
                gauge_type: standard
                needle: false
                smooth_segments: true
                min: 0
                max: >
                  {% if is_state('binary_sensor.qbittorrent_proxied_via_mostar', 'on') %}
                    350
                  {% else %}
                    10240
                  {% endif %}
                height: 200
                show_icon: true
                icon: mdi:upload
                header_position: top
                show_header: false
                state_font_size: 22
                gauge_radius: 40
                decimals: 1
                gauge_background_style:
                  width: 10
                  opacity: 0.7
                gauge_foreground_style:
                  width: 8
                  color: adaptive
                adaptive_icon_color: true
                segments:
                  - from: 0
                    color:
                      - 102
                      - 187
                      - 106
                  - from: 87
                    color:
                      - 67
                      - 160
                      - 71
                  - from: 175
                    color:
                      - 56
                      - 142
                      - 60
                  - from: 262
                    color:
                      - 165
                      - 214
                      - 167
                  - from: 350
                    color:
                      - 200
                      - 230
                      - 201
                secondary: Seeding
                tap_action:
                  action: more-info
              - type: custom:statistics-graph-chart-card
                card_header: Transfer speed (6h, KiB/s)
                show_grid: false
                show_tooltip: true
                show_legend: false
                show_y_axis: false
                show_x_axis: true
                show_x_ticks: false
                show_y_ticks: false
                cache: true
                animate_graph: false
                hours_to_show: 6
                points_per_hour: 4
                height: 152
                chart_mode: timeline
                group_by: interval
                entities:
                  - entity: sensor.qbittorrent_download_speed_kib
                    name: Download
                    color: '#ff9800'
                    graph_type: line
                    line_width: 2
                    show_fill: true
                    smooth: true
                    decimals: 2
                    aggregate_func: avg
                  - entity: sensor.qbittorrent_upload_speed_kib
                    name: Upload
                    color: '#ab47bc'
                    graph_type: line
                    line_width: 2
                    show_fill: true
                    smooth: true
                    decimals: 2
                    aggregate_func: avg
                    tap_action:
                      action: more-info
              - type: custom:statistics-graph-chart-card
                card_header: Torrent states (6h)
                show_grid: false
                show_tooltip: true
                show_legend: false
                show_y_axis: false
                show_x_axis: true
                show_x_ticks: false
                show_y_ticks: false
                cache: true
                animate_graph: false
                hours_to_show: 6
                points_per_hour: 4
                height: 152
                chart_mode: timeline
                group_by: interval
                entities:
                  - entity: sensor.qbittorrent_plus_active_torrents
                    name: Active
                    color: '#42a5f5'
                    graph_type: line
                    line_width: 2
                    show_fill: true
                    smooth: true
                    decimals: 0
                    aggregate_func: max
                  - entity: sensor.qbittorrent_plus_paused_torrents
                    name: Paused
                    color: '#ff9800'
                    graph_type: line
                    line_width: 2
                    show_fill: true
                    smooth: true
                    decimals: 0
                    aggregate_func: max
                  - entity: sensor.qbittorrent_plus_errored_torrents
                    name: Errored
                    color: '#ab47bc'
                    graph_type: line
                    line_width: 2
                    show_fill: false
                    smooth: true
                    decimals: 0
                    aggregate_func: max

          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-gap: 12px
              place-items: stretch
              mediaquery:
                "(max-width: 900px)":
                  grid-template-columns: 1fr
            grid_options:
              columns: full
            cards:
              - type: entities
                title: Controls & totals
                show_header_toggle: false
                state_color: true
                entities:
                  - entity: switch.qbittorrent_plus_alternative_speed
                    name: Alternative speed
                  - entity: button.qbittorrent_plus_pause_all
                    name: Pause all
                  - entity: button.qbittorrent_plus_resume_all
                    name: Resume all
                  - entity: sensor.qbittorrent_plus_connection_status
                    name: Connection
                  - entity: sensor.qbittorrent_plus_session_download
                    name: Session download
                  - entity: sensor.qbittorrent_plus_session_upload
                    name: Session upload
                  - entity: sensor.qbittorrent_plus_all_time_download
                    name: All-time download
                  - entity: sensor.qbittorrent_plus_all_time_upload
                    name: All-time upload
                  - entity: sensor.qbittorrent_plus_free_space_on_disk
                    name: Free space
              - type: vertical-stack
                cards:
                  - type: heading
                    heading_style: subtitle
                    icon: mdi:counter
                    heading: Torrent counts
                  - type: custom:layout-card
                    layout_type: custom:grid-layout
                    layout:
                      grid-template-columns: repeat(3, minmax(0, 1fr))
                      grid-gap: 8px
                      mediaquery:
                        "(max-width: 700px)":
                          grid-template-columns: repeat(2, minmax(0, 1fr))
                    cards:
                      - type: tile
                        entity: sensor.qbittorrent_plus_active_torrents
                        name: Active
                        icon: mdi:progress-download
                        color: green
                        tap_action:
                          action: more-info
                      - type: tile
                        entity: sensor.qbittorrent_plus_inactive_torrents
                        name: Inactive
                        icon: mdi:sleep
                        color: cyan
                        tap_action:
                          action: more-info
                      - type: tile
                        entity: sensor.qbittorrent_plus_paused_torrents
                        name: Paused
                        icon: mdi:pause
                        color: orange
                        tap_action:
                          action: more-info
                      - type: tile
                        entity: sensor.qbittorrent_plus_errored_torrents
                        name: Errored
                        icon: mdi:alert-circle
                        color: red
                        tap_action:
                          action: more-info
                      - type: tile
                        entity: sensor.qbittorrent_plus_all_torrents
                        name: Total
                        icon: mdi:format-list-bulleted
                        color: primary
                        tap_action:
                          action: more-info
                      - type: tile
                        entity: sensor.qbittorrent_plus_status
                        name: Mode
                        icon: mdi:state-machine
                        color: amber
                        tap_action:
                          action: more-info
                  # Proxy health: qBittorrent last_external_address_v4 vs Mikrotik-Mostar PublicIP.
                  - type: custom:button-card
                    entity: binary_sensor.qbittorrent_proxied_via_mostar
                    show_icon: false
                    show_name: false
                    show_state: false
                    show_label: false
                    triggers_update:
                      - sensor.qbittorrent_plus_external_ip
                      - sensor.mikrotik_mostar_environment_publicip
                    tap_action:
                      action: more-info
                    styles:
                      card:
                        - background-color: rgba(28, 28, 28, 0.92)
                        - border: 1px solid rgba(255, 255, 255, 0.08)
                        - border-radius: 12px
                        - padding: 12px 14px
                        - box-shadow: none
                      grid:
                        - grid-template-areas: '"r"'
                      custom_fields:
                        r:
                          - width: 100%
                    custom_fields:
                      r: |
                        [[[
                          const bad = (v) => !v || ['unknown','unavailable','none',''].includes(String(v).toLowerCase());
                          const qSt = hass.states['sensor.qbittorrent_plus_external_ip'];
                          const mSt = hass.states['sensor.mikrotik_mostar_environment_publicip'];
                          const health = hass.states['binary_sensor.qbittorrent_proxied_via_mostar'];
                          let qIp = qSt && qSt.state ? String(qSt.state).trim() : '';
                          let mIp = mSt && mSt.state ? String(mSt.state).trim() : '';
                          if (mIp.indexOf('/') >= 0) mIp = mIp.split('/')[0];
                          const qShow = bad(qIp) ? '—' : qIp;
                          const mShow = bad(mIp) ? '—' : mIp;
                          let mark = '❓';
                          let markColor = '#90a4ae';
                          let label = 'Proxy status unknown';
                          let border = 'rgba(144,164,174,0.35)';
                          let bg = 'rgba(144,164,174,0.08)';
                          if (health && health.state === 'on') {
                            mark = '✓';
                            markColor = '#66bb6a';
                            label = 'Proxied via Mostar';
                            border = 'rgba(102,187,106,0.45)';
                            bg = 'rgba(102,187,106,0.12)';
                          } else if (health && health.state === 'off' && !bad(qIp) && !bad(mIp)) {
                            mark = '✗';
                            markColor = '#ef5350';
                            label = 'Not proxied (WAN mismatch)';
                            border = 'rgba(239,83,80,0.45)';
                            bg = 'rgba(239,83,80,0.12)';
                          }
                          return '' +
                            '<div style="display:flex;flex-direction:column;gap:10px;font-family:var(--ha-font-family,sans-serif);color:#fff;width:100%;">' +
                              '<div style="display:flex;align-items:center;gap:12px;min-width:0;">' +
                                '<div style="width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.45rem;font-weight:800;color:' + markColor + ';background:' + bg + ';border:1px solid ' + border + ';flex-shrink:0;">' + mark + '</div>' +
                                '<div style="min-width:0;">' +
                                  '<div style="font-weight:700;font-size:0.95rem;">' + label + '</div>' +
                                  '<div style="font-size:0.72rem;opacity:0.7;margin-top:2px;">qBittorrent WAN must match Mikrotik-Mostar PublicIP</div>' +
                                '</div>' +
                              '</div>' +
                              '<div style="display:flex;gap:16px;flex-wrap:wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.78rem;">' +
                                '<div><div style="opacity:0.55;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px;">qBittorrent</div><div style="font-weight:700;">' + qShow + '</div></div>' +
                                '<div><div style="opacity:0.55;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px;">Mostar WAN</div><div style="font-weight:700;">' + mShow + '</div></div>' +
                              '</div>' +
                            '</div>';
                        ]]]

          - type: heading
            heading_style: subtitle
            icon: mdi:file-download-outline
            heading: Active transfers

