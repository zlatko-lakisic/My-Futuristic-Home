                custom_fields:
                  title: Title
                  cat: Category
                  size: Size
                  sp: S/P
                  prog:
                    card:
                      type: custom:button-card
                      template: torrent_sort_header_btn
                      name: |
                        [[[
                          const on = states['input_select.qbittorrent_active_sort'].state === 'progress';
                          return on ? 'Progress ▾' : 'Progress';
                        ]]]
                      styles:
                        name:
                          - justify-self: start
                          - color: |
                              [[[
                                return entity.state === 'progress' ? '#ffffff' : '#cfd8dc';
