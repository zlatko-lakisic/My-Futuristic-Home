- type: custom:button-card
  name: Bottom Hallway
  show_icon: false
  show_state: false
  triggers_update: all
  tap_action:
    action: none
  hold_action:
    action: none
  label: |
    [[[
      const ids = ['light.kitchenette_light','light.kitchenette_counter_light_light','light.garage_hallway_light_switch'];
      const on = ids.filter(id => hass.states[id]?.state === 'on').length;
      return on + (on === 1 ? ' light on' : ' lights on');
    ]]]
  show_label: true
  styles:
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - padding: 0
      - height: 40px
    grid:
      - grid-template-areas: '"n l"'
      - grid-template-columns: 1fr auto
    name:
      - font-size: 18px
      - font-weight: 800
      - justify-self: start
    label:
      - font-size: 12px
      - font-weight: 700
      - color: "#7dd3fc"
      - background: rgba(56,189,248,0.16)
      - border-radius: 999px
      - padding: 4px 8px
- type: grid
  columns: 2
  square: false
  cards:
    - type: tile
      entity: light.kitchenette_light
      name: Kitchenette
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      features:
        - type: light-brightness
    - type: tile
      entity: light.kitchenette_counter_light_light
      name: Counter
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      features:
        - type: toggle
    - type: tile
      entity: light.garage_hallway_light_switch
      name: Garage hall
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      features:
        - type: light-brightness
    - type: tile
      entity: lock.door_to_garage
      name: Door to garage
      tap_action:
        action: call-service
        service: lock.toggle
        target:
          entity_id: lock.door_to_garage
      hold_action:
        action: more-info
