- type: custom:button-card
  name: Living Room
  show_icon: false
  show_state: false
  triggers_update: all
  tap_action:
    action: none
  hold_action:
    action: none
  label: |
    [[[
      const ids = ['switch.spotlight_switch','switch.living_room_livingroom_lamp_1','switch.living_room_livingroom_lamp_2'];
      const on = ids.filter(id => hass.states[id]?.state === 'on').length;
      return on + (on === 1 ? ' light on' : ' lights on');
    ]]]
  show_label: true
  styles:
    card:
      - background: transparent
      - box-shadow: none
      - border: none
      - padding: 0
      - height: 40px
    grid:
      - grid-template-areas: '"n l"'
      - grid-template-columns: 1fr auto
    name:
      - font-size: 18px
      - font-weight: 800
      - justify-self: start
    label:
      - font-size: 12px
      - font-weight: 700
      - color: "#7dd3fc"
      - background: rgba(56,189,248,0.16)
      - border-radius: 999px
      - padding: 4px 8px
- type: grid
  columns: 2
  square: false
  cards:
    - type: tile
      entity: switch.spotlight_switch
      name: Spots
      icon: mdi:ceiling-light
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      features:
        - type: toggle
    - type: tile
      entity: switch.living_room_livingroom_lamp_1
      name: Lamp 1
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      features:
        - type: toggle
    - type: tile
      entity: switch.living_room_livingroom_lamp_2
      name: Lamp 2
      tap_action:
        action: toggle
      hold_action:
        action: more-info
      features:
        - type: toggle
- type: thermostat
  entity: climate.new_livingroom_climate
  name: Climate
  features:
    - type: climate-hvac-modes
      style: icons
      hvac_modes:
        - "off"
        - cool
        - heat
- type: tile
  entity: media_player.living_room_tv
  name: TV
  tap_action:
    action: call-service
    service: media_player.media_play_pause
    target:
      entity_id: media_player.living_room_tv
  hold_action:
    action: more-info
