# Family Car (LilyGO T-Beam GPS + Frigate driveway LPR).
# Ingest: the T-Beam (over home Wi-Fi) and the MetSci ChirpStack HTTP
# integration (LoRaWAN uplinks) both POST to one webhook, handled by the
# car_tracker_ingest automation below. The webhook id is the secret
# car_tracker_webhook_id (secrets.yaml, not in git); the firmware gets the
# same id from car-tracker/secrets/.ha_webhook. Helpers keep car_tracker_*
# entity IDs; the map identity is device_tracker.family_car (template GPS
# tracker, not device_tracker.see, removed in Core 2027.5).

input_boolean:
  car_tracker_ignition:
    name: Family Car ignition raw
    icon: mdi:car-key

input_number:
  car_tracker_battery:
    name: Family Car battery raw
    min: 0
    max: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:battery
  car_tracker_last_seq:
    name: Family Car last seq raw
    min: 0
    max: 65535
    step: 1
    mode: box
    icon: mdi:counter
  car_tracker_lat:
    name: Family Car latitude raw
    min: -90
    max: 90
    step: 0.0000001
    mode: box
    # No "initial": it would reset the car to home on every HA restart.
    # The helper restores its last state instead.
    icon: mdi:latitude
  car_tracker_lon:
    name: Family Car longitude raw
    min: -180
    max: 180
    step: 0.0000001
    mode: box
    icon: mdi:longitude

input_text:
  car_tracker_transport:
    name: Family Car transport raw
    max: 16
    icon: mdi:transit-connection-variant

template:
  - device_tracker:
      - name: Family Car
        unique_id: family_car_template
        latitude: "{{ states('input_number.car_tracker_lat') | float(0) }}"
        longitude: "{{ states('input_number.car_tracker_lon') | float(0) }}"
  - binary_sensor:
      - name: Family Car ignition
        unique_id: car_tracker_ignition
        device_class: power
        icon: mdi:car-key
        state: "{{ is_state('input_boolean.car_tracker_ignition', 'on') }}"
  - sensor:
      - name: Family Car battery
        unique_id: car_tracker_battery
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        state: "{{ states('input_number.car_tracker_battery') }}"
      - name: Family Car transport
        unique_id: car_tracker_transport
        icon: mdi:transit-connection-variant
        state: "{{ states('input_text.car_tracker_transport') }}"
      - name: Family Car last seq
        unique_id: car_tracker_last_seq
        state_class: measurement
        state: "{{ states('input_number.car_tracker_last_seq') | int(0) }}"
      - name: Family Car LPR
        unique_id: family_car_lpr
        icon: mdi:car-search
        state: "{{ states('sensor.driveway_last_recognized_plate') }}"
        attributes:
          known_as: Family Car
          plate_sensor: sensor.driveway_last_recognized_plate
          frigate_last_camera: "{{ states('sensor.frigate_family_car_last_camera') }}"
          matched: >-
            {{ is_state('sensor.driveway_last_recognized_plate', 'Family Car')
               or (states('sensor.frigate_family_car_last_camera')
                   | lower not in ['unknown', 'unavailable', 'none', '']) }}

homeassistant:
  customize:
    device_tracker.family_car:
      friendly_name: Family Car
      icon: mdi:car
    device_tracker.googlefindmytools_mc:
      friendly_name: Family Car Find Hub
      icon: mdi:bluetooth
    sensor.family_car_lpr:
      friendly_name: Family Car LPR
      icon: mdi:car-search

automation:
  # One ingest path for every backhaul. Body is the ChirpStack v4 HTTP
  # integration "up" event: {"object": <decoder/chirpstack_codec.js output>, ...}.
  # The firmware posts the same shape over Wi-Fi and adds "transport": "wifi";
  # ChirpStack posts carry no transport and are LoRaWAN. Join, status and log
  # events from ChirpStack have no "object" and are ignored.
  - id: car_tracker_ingest
    alias: Family Car ingest (Wi-Fi + LoRaWAN)
    mode: queued
    max: 100
    triggers:
      - trigger: webhook
        webhook_id: !secret car_tracker_webhook_id
        allowed_methods:
          - POST
        local_only: false
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.json is mapping
             and trigger.json.object is defined
             and trigger.json.object is mapping
             and trigger.json.object.get('event') == 'sample' }}
    actions:
      - variables:
          s: "{{ trigger.json.object }}"
          transport: "{{ trigger.json.get('transport', 'lorawan') }}"
      - if:
          - condition: template
            value_template: >-
              {{ s.get('fix_valid', false) | bool
                 and s.get('lat') is number and s.get('lon') is number }}
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.car_tracker_lat
            data:
              value: "{{ s.lat }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.car_tracker_lon
            data:
              value: "{{ s.lon }}"
      - action: >-
          input_boolean.turn_{{ 'on' if s.get('ignition', false) | bool else 'off' }}
        target:
          entity_id: input_boolean.car_tracker_ignition
      - if:
          - condition: template
            value_template: "{{ s.get('battery_pct') is number }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.car_tracker_battery
            data:
              value: "{{ s.battery_pct }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.car_tracker_transport
        data:
          value: "{{ transport }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.car_tracker_last_seq
        data:
          value: "{{ s.get('seq', 0) | int }}"

  # Frigate known_plates name the plate "Family Car" on
  # sensor.driveway_last_recognized_plate; Frigate also exposes
  # sensor.frigate_family_car_last_camera when that plate is seen.
  # Mark the map tracker home at zone.home (T-Beam GPS still wins when away).
  - id: family_car_lpr_home
    alias: Family Car LPR → home
    description: >
      When Frigate LPR matches the known Family Car plate (driveway plate
      sensor or frigate_family_car_last_camera), set Family Car lat/lon helpers
      to zone.home so the template device_tracker shows home.
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.driveway_last_recognized_plate
        to: Family Car
      - trigger: state
        entity_id: sensor.frigate_family_car_last_camera
        not_to:
          - unknown
          - unavailable
          - none
          - None
    conditions:
      - condition: template
        value_template: >-
          {{ is_state('sensor.driveway_last_recognized_plate', 'Family Car')
             or (states('sensor.frigate_family_car_last_camera')
                 | lower not in ['unknown', 'unavailable', 'none', '']) }}
    actions:
      - action: input_number.set_value
        data:
          entity_id: input_number.car_tracker_lat
          value: "{{ state_attr('zone.home', 'latitude') }}"
      - action: input_number.set_value
        data:
          entity_id: input_number.car_tracker_lon
          value: "{{ state_attr('zone.home', 'longitude') }}"
