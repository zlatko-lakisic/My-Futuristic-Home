# Gate AI clip media: stitch snapshot bursts into GIF/MP4 for Companion + dashboard.
# Also resolve Frigate-recognized people for zone notifications.
shell_command:
  gate_frames_to_gif: >-
    bash /config/shell/gate_frames_to_gif.sh
    "{{ slug }}" "{{ stamp }}" "{{ count | default(8) }}" "{{ duration_ms | default(450) }}"
  frigate_zone_people: >-
    python3 /config/shell/frigate_zone_people.py
    "{{ camera }}" "{{ since_epoch }}" "{{ zone | default('') }}" "{{ base_url | default('http://192.168.89.37:5000') }}"

input_text:
  gate_ai_last_media:
    name: Gate AI Last Media Path
    max: 255
    icon: mdi:file-gif-box
