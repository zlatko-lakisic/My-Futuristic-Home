# qBittorrent speeds in KiB/s (kilobinary bytes per second) for dashboards.
# Reads sensor.qbittorrent_plus_{download,upload}_speed and converts from MiB/s, MB/s, etc.
# Also exposes Mostar proxy health (qBittorrent external IP == Mikrotik-Mostar PublicIP).
#
# homeassistant.packages:
#   qbittorrent_speed_k: !include packages/qbittorrent_speed_k.yaml

template:
  - sensor:
      - name: qBittorrent download speed KiB
        unique_id: qbittorrent_download_speed_k_rate
        state_class: measurement
        device_class: data_rate
        unit_of_measurement: "KiB/s"
        state: >
          {% set s = states('sensor.qbittorrent_plus_download_speed') %}
          {% if s in ['unknown', 'unavailable', 'none', ''] %}
            {{ s }}
          {% else %}
            {% set v = s | float(0) %}
            {% set u = (state_attr('sensor.qbittorrent_plus_download_speed', 'unit_of_measurement') or '') | lower %}
            {% if 'mib' in u %}
              {{ (v * 1024) | round(2) }}
            {% elif 'mb' in u and 'mib' not in u %}
              {{ ((v * 1000000) / 1024) | round(2) }}
            {% elif 'kib' in u %}
              {{ v | round(2) }}
            {% elif 'kb' in u and 'kib' not in u %}
              {{ ((v * 1000) / 1024) | round(2) }}
            {% else %}
              {{ (v * 1024) | round(2) }}
            {% endif %}
          {% endif %}

      - name: qBittorrent upload speed KiB
        unique_id: qbittorrent_upload_speed_k_rate
        state_class: measurement
        device_class: data_rate
        unit_of_measurement: "KiB/s"
        state: >
          {% set s = states('sensor.qbittorrent_plus_upload_speed') %}
          {% if s in ['unknown', 'unavailable', 'none', ''] %}
            {{ s }}
          {% else %}
            {% set v = s | float(0) %}
            {% set u = (state_attr('sensor.qbittorrent_plus_upload_speed', 'unit_of_measurement') or '') | lower %}
            {% if 'mib' in u %}
              {{ (v * 1024) | round(2) }}
            {% elif 'mb' in u and 'mib' not in u %}
              {{ ((v * 1000000) / 1024) | round(2) }}
            {% elif 'kib' in u %}
              {{ v | round(2) }}
            {% elif 'kb' in u and 'kib' not in u %}
              {{ ((v * 1000) / 1024) | round(2) }}
            {% else %}
              {{ (v * 1024) | round(2) }}
            {% endif %}
          {% endif %}

  - binary_sensor:
      - name: qBittorrent proxied via Mostar
        unique_id: qbittorrent_proxied_via_mostar
        device_class: connectivity
        icon: >
          {% set q = states('sensor.qbittorrent_plus_external_ip') | trim %}
          {% set m = (states('sensor.mikrotik_mostar_environment_publicip') | trim).split('/')[0] %}
          {% set bad = ['unknown', 'unavailable', 'none', ''] %}
          {% if q | lower in bad or m | lower in bad %}
            mdi:help-network
          {% elif q == m %}
            mdi:check-circle
          {% else %}
            mdi:close-circle
          {% endif %}
        state: >
          {% set q = states('sensor.qbittorrent_plus_external_ip') | trim %}
          {% set m = (states('sensor.mikrotik_mostar_environment_publicip') | trim).split('/')[0] %}
          {% set bad = ['unknown', 'unavailable', 'none', ''] %}
          {{ q | lower not in bad and m | lower not in bad and q == m }}
        attributes:
          qbittorrent_ip: "{{ states('sensor.qbittorrent_plus_external_ip') }}"
          mostar_ip: "{{ (states('sensor.mikrotik_mostar_environment_publicip') | trim).split('/')[0] }}"
          status: >
            {% set q = states('sensor.qbittorrent_plus_external_ip') | trim %}
            {% set m = (states('sensor.mikrotik_mostar_environment_publicip') | trim).split('/')[0] %}
            {% set bad = ['unknown', 'unavailable', 'none', ''] %}
            {% if q | lower in bad or m | lower in bad %}
              unknown
            {% elif q == m %}
              proxied
            {% else %}
              not_proxied
            {% endif %}
