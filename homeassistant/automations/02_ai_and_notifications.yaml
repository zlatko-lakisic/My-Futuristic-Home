- id: '1748680509520'
  alias: LLM Testing
  description: ''
  triggers: []
  conditions: []
  actions:
  - action: llmvision.image_analyzer
    metadata: {}
    data:
      include_filename: true
      max_tokens: 100
      temperature: 0.2
      provider: 01JWHT1NGX5W2D8NZHKFD7E29J
      message: Describe the image.
      remember: true
      expose_images: true
      model: gemini-2.0-flash
      image_entity:
      - camera.driveway_2
      - image.driveway_car
    response_variable: response
  - action: persistent_notification.create
    metadata: {}
    data:
      title: Front Camera Motion
      message: '{{response.response_text}}'
  mode: single
- id: gate_open_llm_east
  alias: East Gate Open AI Analysis
  description: Blueprint gate_open_llm_vision_people — east gate.
  use_blueprint:
    path: gate_open_llm_vision_people.yaml
    input:
      gate_name: East gate
      gate_slug: east_gate
      property_zone_key: east_gate
      frigate_camera: east_side
      visit_tracking_enabled: true
      gate_sensor: binary_sensor.east_side_door_door
      gate_open_state: 'on'
      # No camera.east_side_2 (AXIS) on this host; Frigate entity for snapshots.
      camera: camera.east_side
      frigate_person_sensor: binary_sensor.east_side_gate_person_occupancy
      frigate_dog_sensor: binary_sensor.east_side_dog_occupancy
      vision_model: gpt-4o-mini
      target_width: 1280
      public_base_url: 'https://ha.mostardesigns.com/local/'
      notification_click_path: /backyard-yaml/backyard-east-side
      notify_people:
      - person.zlatko_lakisic
      notify_service: notify.notify
