- id: zone_activity_llm_near_driveway
  alias: Near Driveway Zone AI Analysis
  description: Blueprint zone_activity_llm_vision — driveway_zone person/car only; one notify per visit.
  use_blueprint:
    path: zone_activity_llm_vision.yaml
    input:
      zone_name: Near driveway
      zone_slug: near_driveway
      trigger_sensors:
      - binary_sensor.driveway_zone_person_occupancy
      - binary_sensor.driveway_zone_car_occupancy
      person_sensor: binary_sensor.driveway_zone_person_occupancy
      car_sensor: binary_sensor.driveway_zone_car_occupancy
      dog_sensor: binary_sensor.driveway_zone_dog_occupancy
      people_only: false
      known_vehicle_hint: >-
        Household vehicle may be Family Car. If Frigate LPR says Family Car, call it
        Family Car and do not describe color/make/model. Otherwise describe the vehicle
        and include a plate only when clearly readable. Never invent plates.
      camera: camera.driveway
      vision_model: gpt-4o-mini
      target_width: 1280
      capture_settle_seconds: 0
      prefer_person_wait_seconds: 12
      frame_interval_seconds: 1
      stream_max_frames: 8
      gif_frame_duration_ms: 800
      event_clear_seconds: 180
      lpr_wait_seconds: 15
      frigate_camera: driveway
      frigate_zone: driveway_zone
      property_zone_key: driveway
      visit_tracking_enabled: true
      recognized_face_sensor: sensor.driveway_last_recognized_face
      recognized_plate_sensor: sensor.driveway_last_recognized_plate
      frigate_base_url: 'http://192.168.89.37:5000'
      public_base_url: 'https://ha.mostardesigns.com/local/'
      notification_click_path: /dashboard-garage/driveway
      notify_group: ha-driveway
      notify_channel: HA Driveway
      notify_people:
      - person.zlatko_lakisic
      notify_service: notify.notify
